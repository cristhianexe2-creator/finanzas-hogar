<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finanzas del Hogar</title>
<meta name="theme-color" content="#0B1B3A"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Finanzas">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex,nofollow">
<style>:root{
  --bg:#F3F5FA; --card:#FFFFFF; --ink:#0F172A; --muted:#64748B; --line:#E2E8F0;
  --navy:#0B1B3A; --navy2:#13285A; --blue:#2563EB; --green:#16A34A; --red:#DC2626; --amber:#F59E0B;
  --violet:#7C3AED; --orange:#EA580C; --teal:#0D9488; --soft-blue:#EFF6FF; --soft-green:#ECFDF5; --soft-red:#FEF2F2;
  --soft-amber:#FFFBEB; --soft-violet:#F5F3FF; --soft-orange:#FFF7ED; --radius:16px; --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;height:100vh;overflow:hidden}
/* sidebar */
.side{width:232px;flex:none;background:linear-gradient(180deg,var(--navy),var(--navy2));color:#CBD5E1;display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;color:#fff}
.brand .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#22C55E,#2563EB);display:grid;place-items:center;font-size:20px}
.brand b{display:block;font-size:15px;line-height:1.1}.brand span{font-size:11px;color:#94A3B8}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:14px;color:#CBD5E1}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:rgba(255,255,255,.13);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #22C55E}
.nav .ic{width:22px;text-align:center;font-size:16px}
.nav .badge{margin-left:auto;background:#DC2626;color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
.side .foot{margin-top:auto;font-size:11px;color:#94A3B8;padding:10px}
.side .foot .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22C55E;margin-right:6px}
.side .foot .dot.warn{background:#F59E0B}
/* main */
.main{flex:1;overflow:auto;padding:22px 28px 60px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.3px}
.top .sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
.monthsel{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
.monthsel button{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--muted);font-size:16px}
.monthsel button:hover{background:#F1F5F9;color:var(--ink)}
.monthsel select{border:0;background:transparent;font-weight:700;font-size:15px;padding:4px 6px;cursor:pointer;text-transform:capitalize}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.pill.red{background:#FEE2E2;color:#991B1B}.pill.green{background:#DCFCE7;color:#166534}.pill.amber{background:#FEF3C7;color:#92400E}
.pill.blue{background:#DBEAFE;color:#1E3A8A}.pill.gray{background:#F1F5F9;color:#475569}.pill.violet{background:#EDE9FE;color:#5B21B6}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
@media (max-width:1250px){.g4{grid-template-columns:repeat(2,1fr)}.g21,.g12,.g3{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;border:1px solid #EEF1F6;min-width:0}
.card h3{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .hint{font-weight:400;color:var(--muted);font-size:12px;margin-left:auto}
.kpi{position:relative;overflow:hidden;padding:18px 20px}
.kpi .lab{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;display:flex;gap:6px;align-items:center}
.kpi .val{font-size:30px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.kpi .foot{font-size:12px;color:var(--muted);margin-top:4px}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;opacity:.12;background:currentColor}
.kpi.k-green{color:var(--green)}.kpi.k-red{color:var(--red)}.kpi.k-blue{color:var(--blue)}.kpi.k-violet{color:var(--violet)}
.kpi .val,.kpi .foot,.kpi .lab{color:inherit}.kpi .foot{color:var(--muted)}.kpi .lab{color:var(--muted)}
.sema{font-size:26px;font-weight:800;border-radius:12px;padding:6px 14px;display:inline-block;margin-top:6px;color:#fff}
.sema.Rojo{background:var(--red)}.sema.Amarillo{background:#EAB308;color:#111}.sema.Verde{background:var(--green)}.sema.Sin{background:#94A3B8}
.neg{color:var(--red)!important}.pos{color:var(--green)!important}.mut{color:var(--muted)}
.bar{height:10px;border-radius:99px;background:#EEF2F7;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.rowbar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin:10px 0}
.rowbar .n{font-size:13px}.rowbar .v{font-weight:700;font-size:13px;text-align:right}.rowbar .bar{grid-column:1/3;height:8px}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.t th{position:sticky;top:0;background:#F8FAFC;color:#475569;font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);z-index:1;white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid #F1F5F9;vertical-align:middle}
table.t tr:hover td{background:#FAFCFF}
table.t td.r,table.t th.r{text-align:right;white-space:nowrap}table.t td.c,table.t th.c{text-align:center}
table.t tfoot td{font-weight:800;background:#F8FAFC;border-top:1px solid var(--line)}
.scroll{overflow:auto;max-height:560px;border-radius:12px;border:1px solid var(--line)}
.ed input,.ed select{width:100%;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;min-width:60px}
.ed input:hover,.ed select:hover{border-color:var(--line);background:#fff}
.ed input:focus,.ed select:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px #DBEAFE}
.ed input.num{text-align:right}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px;background:#fff;border:1px solid var(--line);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.btn:hover{background:#F8FAFC}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}.btn.pri:hover{filter:brightness(.95)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.big{padding:13px 26px;font-size:16px;border-radius:12px}
.icon-btn{all:unset;cursor:pointer;padding:4px 7px;border-radius:7px;color:var(--muted)}
.icon-btn:hover{background:#F1F5F9;color:var(--red)}
.form{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:10px;align-items:end}
.fld label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px #DBEAFE}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{all:unset;cursor:pointer;padding:7px 12px;border-radius:99px;border:1.5px solid var(--line);font-size:13px;font-weight:600;background:#fff}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.preview{margin-top:14px;padding:12px 16px;border-radius:12px;background:var(--soft-blue);color:#1E3A8A;font-weight:600;display:flex;align-items:center;gap:10px}
.addcard{border:2px solid #FDBA74;background:linear-gradient(180deg,#FFF7ED,#fff)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:#F1F5F9;color:#475569;font-weight:600;white-space:nowrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{all:unset;cursor:pointer;padding:10px 16px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.tabs button .sw{width:12px;height:12px;border-radius:4px}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.ccard{border-radius:18px;color:#fff;padding:20px 22px;min-height:170px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(15,23,42,.18)}
.ccard::before{content:"";position:absolute;right:-60px;bottom:-80px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.12)}
.ccard .bk{font-size:12px;opacity:.85;text-transform:uppercase;letter-spacing:1px}.ccard .nm{font-size:20px;font-weight:800;margin-top:4px}
.ccard .num{font-family:Consolas,monospace;letter-spacing:3px;margin-top:22px;opacity:.9}
.ccard .row{display:flex;gap:26px;margin-top:14px;font-size:12px}.ccard .row b{display:block;font-size:16px}
.tl{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.tlm{flex:none;width:150px;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}
.tlm.cur{border:2px solid var(--blue);box-shadow:0 0 0 4px #DBEAFE}
.tlm .m{font-weight:800;text-transform:capitalize}.tlm .d{font-size:11px;color:var(--muted)}
.tlm .tot{font-size:18px;font-weight:800;margin:8px 0 2px}
.tlm input{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:5px 7px;text-align:right;margin-top:3px}
.tlm .lb{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-top:6px}
.sec{border-radius:16px;overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow);background:#fff;border:1px solid #EEF1F6}
.sec>.hd{padding:14px 20px;color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;gap:10px}
.sec>.bd{padding:16px 20px}
.msg{padding:14px 16px;border-radius:12px;font-weight:600;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
.msg .e{font-size:18px;line-height:1.2}
.msg.rojo{background:#FEE2E2;color:#991B1B}.msg.verde{background:#DCFCE7;color:#166534}.msg.naranja{background:#FFEDD5;color:#9A3412}
.msg.amarillo{background:#FEF9C3;color:#854D0E}.msg.info{background:#EFF6FF;color:#1E3A8A}.msg.gris{background:#F3F4F6;color:#374151}
.avisos{display:flex;flex-direction:column;gap:10px}
.split{display:grid;grid-template-columns:240px 1fr 1.6fr;gap:10px 16px;align-items:center}
.split .lbl{font-weight:600}.split .amt{font-weight:800;font-size:18px;text-align:right}
.chat{display:flex;flex-direction:column;height:560px}
.chat .log{flex:1;overflow:auto;padding:6px 4px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:82%;padding:11px 14px;border-radius:14px;line-height:1.5;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.bub.ai{align-self:flex-start;background:#F1F5F9;border-bottom-left-radius:4px}
.bub.ai b{color:#0B1B3A}
.chat .in{display:flex;gap:8px;margin-top:10px}
.chat .in textarea{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;resize:none;height:48px}
.empty{color:var(--muted);text-align:center;padding:30px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0F172A;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:50;transition:opacity .3s}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;z-index:40}
.modal{background:#fff;border-radius:18px;padding:22px;width:min(760px,94vw);max-height:90vh;overflow:auto;box-shadow:0 30px 60px rgba(0,0,0,.3)}
.modal h2{margin:0 0 14px;font-size:18px}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.banner{padding:12px 16px;border-radius:12px;background:#FEF3C7;color:#92400E;font-weight:600;margin-bottom:16px;display:flex;gap:12px;align-items:center}
svg text{font-family:inherit}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid #F1F5F9}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--green)}
.check.done .tx{text-decoration:line-through;color:var(--muted)}
.loan{display:grid;grid-template-columns:1.4fr repeat(5,1fr);gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #F1F5F9}
.loan:last-child{border-bottom:0}
.small{font-size:12px}.tiny{font-size:11px}
.right{text-align:right}
/* ---- IA presente ---- */
.fab{position:fixed;right:22px;bottom:22px;z-index:30;border:0;cursor:pointer;display:flex;align-items:center;gap:8px;padding:14px 20px 14px 16px;border-radius:99px;background:linear-gradient(135deg,#2563EB,#7C3AED);color:#fff;font-size:22px;font-weight:700;box-shadow:0 12px 30px rgba(37,99,235,.45);transition:transform .15s}
.fab span{font-size:15px}.fab:hover{transform:translateY(-2px) scale(1.03)}
.fchat{position:fixed;right:22px;bottom:22px;z-index:30;width:440px;max-width:calc(100vw - 40px);height:min(680px,calc(100vh - 44px));background:#fff;border-radius:20px;box-shadow:0 24px 60px rgba(15,23,42,.35);display:flex;flex-direction:column;overflow:hidden;border:1px solid #E2E8F0}
.fhd{display:flex;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(135deg,#0B1B3A,#2563EB);color:#fff;font-weight:800;font-size:16px}
.fbody{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#F8FAFC}
.fbody .bub{max-width:92%}
.fchips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 0;background:#fff}
.chip{all:unset;cursor:pointer;font-size:12px;padding:5px 10px;border-radius:99px;background:#EFF6FF;color:#1E3A8A;font-weight:600}
.chip:hover{background:#DBEAFE}
.fadj{padding:6px 12px 0;background:#fff}
.fin{display:flex;gap:6px;align-items:flex-end;padding:10px 12px 12px;background:#fff}
.fin textarea{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;resize:none;height:46px;font-size:14px}
.fin textarea:focus{outline:none;border-color:var(--blue)}
.icon-btn.big{font-size:20px;padding:8px}
.icon-btn.rec{background:#FEE2E2;color:#DC2626;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.acts{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.act{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:12.5px;white-space:normal}
.act input{width:16px;height:16px;accent-color:var(--green)}
.act .atx{flex:1;line-height:1.35}
.act.done{background:#ECFDF5;border-color:#A7F3D0;color:#065F46}.act.desc{opacity:.45;text-decoration:line-through}
.dots::after{content:"…";animation:dots 1.2s steps(3,end) infinite;display:inline-block;width:1em;overflow:hidden;vertical-align:bottom}
@keyframes dots{0%{width:0}100%{width:1em}}
.dots{color:var(--muted);font-style:italic}
.hoy{background:linear-gradient(135deg,#EEF2FF,#F5F3FF 60%,#FDF4FF);border:1px solid #E0E7FF}
.hoy .hoytx{font-size:15px;line-height:1.7;white-space:pre-wrap}
.mesbtn{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;margin-bottom:4px;font-weight:600}
.mesbtn:hover{background:#F1F5F9}.mesbtn.on{background:#EFF6FF;box-shadow:inset 3px 0 0 var(--blue)}
.mini{background:#F8FAFC;border-radius:12px;padding:12px 14px}.mini b{font-size:20px}
.mdtx{line-height:1.65;white-space:pre-wrap}.mdh{font-weight:800;font-size:15px;color:#0B1B3A;margin:10px 0 2px}
.coment{animation:fadein .4s}@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
/* ---- login ---- */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0B1B3A,#1E3A8A 60%,#0EA5E9)}
.lcard{background:#fff;border-radius:22px;padding:30px 26px;width:min(400px,100%);text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.lcard h1{font-size:22px;margin:14px 0 4px}.lcard .sub{color:var(--muted);font-size:13px}
.lcard .fld{text-align:left;margin-top:12px}.lcard,.lcard *{box-sizing:border-box}.lcard .btn.big{margin-top:16px}
/* ---- barra móvil ---- */
.mtop,.bnav{display:none}
@media (max-width: 860px){
  body{font-size:14px}
  .app{flex-direction:column;height:auto;min-height:100vh;overflow:visible}
  .side{position:fixed;inset:0 auto 0 0;z-index:45;width:260px;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.4)}
  body.navopen .side{transform:none}
  body.navopen::after{content:"";position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:44}
  .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#0B1B3A,#13285A);color:#fff;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
  .mtop button{all:unset;cursor:pointer;font-size:22px;padding:2px 6px}
  .mtop img{width:30px;height:30px;border-radius:8px}.mtop b{font-size:16px}.mtop .st{margin-left:auto;font-size:11px;color:#CBD5E1}
  .main{overflow:visible;padding:14px 12px 120px}
  .top{margin-bottom:12px}.top h1{font-size:20px}.top .sub{font-size:12px}.top .spacer{display:none}
  .monthsel{width:100%;justify-content:space-between}
  .g4{grid-template-columns:1fr 1fr}.g3,.g2,.g21,.g12{grid-template-columns:1fr}
  .grid[style*="grid-template-columns:260px"]{grid-template-columns:1fr!important}
  .card{padding:14px;overflow-x:auto}.kpi{padding:14px}.kpi .val{font-size:21px}.kpi .lab{font-size:10px}.sema{font-size:18px}
  .form{grid-template-columns:1fr 1fr!important}.form .fld[style*="span 2"]{grid-column:span 2}
  .addcard > div[style*="display:flex"]{flex-wrap:wrap}.addcard .btn.big{flex:1;justify-content:center}
  .split{grid-template-columns:1fr}.split .amt{text-align:left}
  table.t{font-size:12px}table.t th,table.t td{padding:7px 8px}
  .loan{grid-template-columns:1fr 1fr}
  .tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.tabs button{white-space:nowrap;padding:8px 12px}
  .fab{bottom:calc(76px + env(safe-area-inset-bottom));right:14px;padding:12px 16px 12px 13px;font-size:20px}.fab span{font-size:13px}
  .fchat{inset:0;width:100%;max-width:none;height:100%;border-radius:0}
  .fhd{padding-top:max(14px,env(safe-area-inset-top))}
  .fin{padding-bottom:max(12px,env(safe-area-inset-bottom))}
  .modal{width:100%;max-height:92vh;border-radius:18px 18px 0 0;align-self:end}.modal-bg{place-items:end center}.mgrid{grid-template-columns:1fr}

<script>// ===================== MOTOR DE CÁLCULO (misma lógica que el Excel) =====================
const Engine = (() => {
  const NMESES = 36;
  const ym = (s) => { const [y, m] = s.split("-").map(Number); return { y, m }; };
  const mkey = (y, m) => { const d = new Date(Date.UTC(y, m - 1, 1)); return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0"); };
  const addM = (k, n) => { const { y, m } = ym(k); return mkey(y, m + n); };
  const diffM = (a, b) => { const A = ym(a), B = ym(b); return (A.y - B.y) * 12 + A.m - B.m; }; // a - b
  const lastDay = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
  const parseD = (s) => { if (!s) return null; const [y, m, d] = s.split("-").map(Number); return { y, m, d }; };
  const dKey = (p) => mkey(p.y, p.m);
  const dateNum = (y, m, d) => { const x = new Date(Date.UTC(y, m - 1, 1)); return Date.UTC(x.getUTCFullYear(), x.getUTCMonth(), d); };
  const num = (v) => (v === null || v === undefined || v === "" || isNaN(+v)) ? 0 : +v;
  const has = (v) => !(v === null || v === undefined || v === "");
  const r2 = (x) => Math.round(x * 100) / 100;

  function months(data) {
    const out = []; for (let i = 0; i < NMESES; i++) out.push(addM(data.config.mesInicio, i)); return out;
  }
  function cardByName(data, name) { return data.tarjetas.find(c => c.nombre === name); }

  // fila de tarjeta: devuelve {k: primer resumen, o: último, v: valor cuota}
  function cardRow(c, card) {
    if (!has(c.total) && !has(c.valorCuota)) return null;
    let k;
    if (has(c.resumen)) k = c.resumen;
    else { const f = parseD(c.fecha); if (!f) return null; k = f.d <= card.cierre ? dKey(f) : addM(dKey(f), 1); }
    const n = has(c.cuotas) ? +c.cuotas : 1;
    const v = has(c.valorCuota) ? +c.valorCuota : r2(num(c.total) / n);
    const o = addM(k, n - (has(c.cuotaInicial) ? +c.cuotaInicial : 1));
    return { k, o, v };
  }
  // movimiento de "Cargar"
  function movRow(mv, data) {
    const f = parseD(mv.fecha);
    const res = { mes: f ? dKey(f) : null, cash: 0, card: null };
    if (!f || !has(mv.monto)) return res;
    const card = cardByName(data, mv.medio);
    if (!card) { res.cash = num(mv.monto) * (mv.moneda === "USD" ? data.config.tc : 1); return res; }
    const k = f.d <= card.cierre ? dKey(f) : addM(dKey(f), 1);
    const n = has(mv.cuotas) ? +mv.cuotas : 1;
    res.card = { card, k, o: addM(k, n - 1), v: r2(num(mv.monto) / n), n };
    return res;
  }
  const inRange = (m, a, b) => m >= a && m <= b;

  function freqN(f) { return ({ "Mensual": 1, "Cada 2 meses": 2, "Cada 3 meses": 3, "Cada 6 meses": 6, "Anual": 12, "Meses específicos": 0 })[f]; }
  function recurring(row, m, data, montoField) {
    const monto = row._monto !== undefined ? row._monto : row[montoField];
    if (!has(monto) || !has(row.frecuencia)) return 0;
    const st = row.desde || data.config.mesInicio;
    if (m < st) return 0;
    if (has(row.hasta) && m > row.hasta) return 0;
    if (row.frecuencia === "Meses específicos") {
      const list = String(row.meses || "").replace(/\s/g, "").split(",").filter(Boolean).map(Number);
      return list.includes(ym(m).m) ? +monto : 0;
    }
    const n = freqN(row.frecuencia); if (!n) return 0;
    return diffM(m, st) % n === 0 ? +monto : 0;
  }
  function fijoMonto(fx, m, data, movs) {
    const row = Object.assign({}, fx);
    if (fx.usaPresupuestoComida) row._monto = data.config.presComida;
    let v = recurring(row, m, data, "monto");
    if (fx.descuentaNafta && v > 0) {
      let real = 0;
      for (const mv of movs) {
        if (mv.src.tipo !== "Gasto" || mv.src.moneda === "USD") continue;
        const d = String(mv.src.descripcion || "").toLowerCase();
        if (!(d.includes("ancap") || d.includes("nafta"))) continue;
        const mm = mv.card ? mv.card.k : mv.mes;
        if (mm === m) real += num(mv.src.monto);
      }
      v = Math.max(0, v - real);
    }
    return v;
  }
  function ingresoMonto(ig, m, data) {
    const row = Object.assign({}, ig);
    if (ig.formula && data.ingresos[ig.formula.base]) row._monto = Math.round(num(data.ingresos[ig.formula.base].monto) * ig.formula.factor);
    return recurring(row, m, data, "monto");
  }
  function rate(n, pmt, pv) { // tasa mensual tal que pv = pmt*(1-(1+r)^-n)/r
    if (!(n > 0) || !(pmt > 0) || !(pv > 0)) return null;
    if (pmt * n <= pv) return null;
    let r = 0.02;
    for (let i = 0; i < 200; i++) {
      const f = pmt * (1 - Math.pow(1 + r, -n)) / r - pv;
      const df = pmt * (n * Math.pow(1 + r, -n - 1) / r - (1 - Math.pow(1 + r, -n)) / (r * r));
      const nr = r - f / df; if (!isFinite(nr)) return null;
      if (Math.abs(nr - r) < 1e-12) { r = nr; break; } r = Math.max(1e-9, nr);
    }
    return r;
  }
  const pv = (r, n, pmt) => r === 0 ? pmt * n : pmt * (1 - Math.pow(1 + r, -n)) / r;

  function prestamoInfo(p, data) {
    const out = { ok: false };
    if (!has(p.cuotasTotales) || !has(p.cuota)) return out;
    out.ok = true;
    out.faltan = +p.cuotasTotales - num(p.pagadas);
    out.totalFalta = out.faltan * +p.cuota;
    out.pctPagado = num(p.pagadas) / +p.cuotasTotales;
    let rm = null;
    if (has(p.capital)) rm = rate(+p.cuotasTotales, +p.cuota, +p.capital);
    else if (has(p.saldoBanco)) rm = rate(out.faltan, +p.cuota, +p.saldoBanco);
    out.tea = rm === null ? null : Math.pow(1 + rm, 12) - 1;
    out.debes = has(p.saldoBanco) ? +p.saldoBanco : (out.tea === null ? null : pv(Math.pow(1 + out.tea, 1 / 12) - 1, out.faltan, +p.cuota));
    const prox = parseD(p.proxima);
    if (prox) { out.primera = addM(dKey(prox), -num(p.pagadas)); out.ultima = addM(dKey(prox), out.faltan - 1); }
    out.factor = p.moneda === "UI" ? data.config.ui : 1;
    return out;
  }

  function compute(data, today) {
    today = today || new Date();
    const T = Date.UTC(today.getFullYear(), today.getMonth(), today.getDate());
    const M = months(data); const TC = num(data.config.tc);
    const movs = data.movimientos.map(mv => Object.assign({ src: mv }, movRow(mv, data)));
    const R = { months: M, cards: [], proy: [], movs };
    // ----- tarjetas
    for (const card of data.tarjetas) {
      const rows = card.compras.map(c => ({ c, g: cardRow(c, card) })).filter(x => x.g);
      const res = M.map(m => {
        const o = { mes: m, compUYU: 0, compUSD: 0, fijUYU: 0, fijUSD: 0, prestamo: 0 };
        for (const { c, g } of rows) if (inRange(m, g.k, g.o)) {
          if (c.moneda === "USD") o.compUSD += g.v; else { o.compUYU += g.v; if (c.categoria === "Préstamos") o.prestamo += g.v; }
        }
        for (const mv of movs) if (mv.card && mv.card.card === card && inRange(m, mv.card.k, mv.card.o)) {
          if (mv.src.moneda === "USD") o.compUSD += mv.card.v; else o.compUYU += mv.card.v;
        }
        for (const fx of data.fijos) if (fx.medio === card.nombre) {
          const v = fijoMonto(fx, m, data, movs); if (fx.moneda === "USD") o.fijUSD += v; else o.fijUYU += v;
        }
        const { y, m: mm } = ym(m);
        o.cierre = dateNum(y, mm, Math.min(card.cierre, lastDay(y, mm)));
        const vy = card.vence <= card.cierre ? 1 : 0;
        const ld = new Date(Date.UTC(y, mm - 1 + vy + 1, 0)).getUTCDate();
        o.vence = dateNum(y, mm + vy, Math.min(card.vence, ld));
        o.mesPago = mkey(y, mm + vy);
        o.totUYU = o.compUYU + o.fijUYU; o.totUSD = o.compUSD + o.fijUSD;
        const pg = card.pagos[m] || {}; o.pagUYU = num(pg.uyu); o.pagUSD = num(pg.usd);
        o.saldoUYU = o.totUYU - o.pagUYU; o.saldoUSD = o.totUSD - o.pagUSD;
        o.totEq = o.totUYU + o.totUSD * TC;
        { const vd = new Date(o.vence); o.desde = Date.UTC(vd.getUTCFullYear(), vd.getUTCMonth(), 1); }
        o.estado = (Math.abs(o.totUYU + o.totUSD) < 1e-9) ? "-" :
          (o.saldoUYU <= 0.005 && o.saldoUSD <= 0.005 ? "Pagado" : (o.vence < T ? "VENCIDO" : (o.cierre < T ? (T >= o.desde ? "A pagar" : "Cerrado") : "En curso")));
        return o;
      });
      let idx = res.filter(o => o.vence < T).length; if (idx >= res.length) idx = res.length - 1;
      const cur = res[idx];
      let usado = 0;
      res.forEach((o, i) => {
        if (i <= idx) usado += o.saldoUYU + TC * o.saldoUSD;
        else usado += (o.compUYU - o.pagUYU - o.prestamo) + TC * (o.compUSD - o.pagUSD);
      });
      const info = { card, res, actual: cur, usado, limite: num(card.limite), disponible: num(card.limite) - usado,
        pct: num(card.limite) ? usado / num(card.limite) : 0,
        falta: Math.max(0, cur.saldoUYU) + Math.max(0, cur.saldoUSD) * TC, rows };
      R.cards.push(info);
    }
    // ----- préstamos
    R.prestamos = data.prestamos.map(p => ({ p, i: prestamoInfo(p, data) }));
    const prestMes = (m, filt) => R.prestamos.reduce((s, { p, i }) => {
      if (!i.ok || !i.primera || !filt(p)) return s;
      return s + (inRange(m, i.primera, i.ultima) ? +p.cuota * i.factor * (p.moneda === "USD" ? TC : 1) : 0);
    }, 0);
    // ----- proyección
    const prefijos = [["Sueldo", "Sueldo"], ["Aguinaldo", "Aguinaldo"], ["SRV", "SRV"], ["Licencia", "Licencia"]];
    let acum = 0;
    M.forEach((m, n) => {
      let B = 0; const detIng = [];
      data.ingresos.forEach(ig => {
        let v = ingresoMonto(ig, m, data) * (ig.moneda === "USD" ? TC : 1);
        if (!v) return;
        const pf = prefijos.find(([p]) => String(ig.nombre).startsWith(p));
        if (pf && movs.some(mv => mv.src.tipo === pf[1] && mv.src.persona === ig.persona && mv.mes === m)) { detIng.push({ nombre: ig.nombre, v, reemplazado: true }); return; }
        B += v; detIng.push({ nombre: ig.nombre, v });
      });
      const C = movs.filter(mv => mv.mes === m && mv.src.tipo && mv.src.tipo !== "Gasto").reduce((s, mv) => s + mv.cash, 0);
      const E = R.cards.reduce((s, ci) => s + ci.res.filter(o => o.mesPago === m).reduce((a, o) => a + o.totEq, 0), 0);
      let F = 0; data.fijos.forEach(fx => { if (cardByName(data, fx.medio)) return; F += fijoMonto(fx, m, data, movs) * (fx.moneda === "USD" ? TC : 1); });
      const G = prestMes(m, p => p.forma !== "Retención de sueldo" && p.forma !== "Se cobra en tarjeta");
      const ret = prestMes(m, p => p.forma === "Retención de sueldo");
      const H = movs.filter(mv => mv.mes === m && mv.src.tipo === "Gasto").reduce((s, mv) => s + mv.cash, 0);
      const RS = data.reservas || [];
      const resIn = RS.filter(r => r.para === m).reduce((s, r) => s + num(r.monto), 0);
      const resOut = RS.filter(r => r.de === m).reduce((s, r) => s + num(r.monto), 0);
      RS.filter(r => r.para === m).forEach(r => detIng.push({ nombre: "Guardado en " + mesLargo(r.de) + (r.motivo ? " (" + r.motivo + ")" : ""), v: num(r.monto), reserva: true }));
      const D = B + C + resIn, I = E + F + G + H + resOut, J = D - I; acum += J;
      const L = D === 0 ? "Sin ingresos" : (J < 0 ? "Rojo" : (J < D * 0.1 ? "Amarillo" : "Verde"));
      R.proy.push({ mes: m, B, C, D, E, F, G, H, I, J, K: acum, L, ret, detIng, resIn, resOut });
    });
    return R;
  }

  // consumo del mes por categoría (como el Panel del Excel)
  function categorias(data, R, m) {
    const TC = num(data.config.tc); const out = {};
    const add = (k, v) => { if (!v) return; k = k || "Sin categoría"; out[k] = (out[k] || 0) + v; };
    R.cards.forEach(ci => ci.rows.forEach(({ c, g }) => { if (inRange(m, g.k, g.o)) add(c.categoria, g.v * (c.moneda === "USD" ? TC : 1)); }));
    data.fijos.forEach(fx => add(fx.categoria, fijoMonto(fx, m, data, R.movs) * (fx.moneda === "USD" ? TC : 1)));
    R.movs.forEach(mv => {
      if (mv.src.tipo !== "Gasto") return;
      if (mv.card) { if (inRange(m, mv.card.k, mv.card.o)) add(mv.src.categoria, mv.card.v * (mv.src.moneda === "USD" ? TC : 1)); }
      else if (mv.mes === m) add(mv.src.categoria, mv.cash);
    });
    const p = R.proy.find(x => x.mes === m); if (p) add("Préstamos", p.G);
    return out;
  }
  function comida(data, R, m) {
    const TC = num(data.config.tc); let s = 0;
    R.movs.forEach(mv => { if (mv.src.tipo === "Gasto" && mv.src.categoria === "Supermercado" && mv.mes === m) s += num(mv.src.monto) * (mv.src.moneda === "USD" ? TC : 1); });
    data.tarjetas.forEach(card => card.compras.forEach(c => {
      if (c.categoria !== "Supermercado" || !c.fecha) return;
      if (c.fecha.slice(0, 7) === m) s += num(c.total) + num(c.valorCuota) * num(c.cuotas);
    }));
    return s;
  }

  // ----- asesor (misma lógica que la hoja Asesor)
  function asesor(data, R, m) {
    const TC = num(data.config.tc); const k = R.months.indexOf(m); const P = R.proy;
    const p = P[k]; const A = data.asesor || {};

    row[el.dataset.k] = v; if (T.after) T.after(row, el.dataset.k); commit();
  }));
  root.querySelectorAll("[data-del]").forEach(el => el.addEventListener("click", () => {
    const T = TABLES[el.dataset.del]; const arr = T.get(); const row = arr[+el.dataset.i];
    if (!confirm(`¿Borrar "${row[T.name || "nombre"] || "esta fila"}"?`)) return;

}

// ---- gráficos SVG
function svgBars(labels, series, { h = 240, money: isMoney = true, neg = true } = {}) {
  const W = 760, H = h, pl = 56, pr = 10, pt = 14, pb = 34;
  const all = series.flatMap(s => s.values); let mx = Math.max(0, ...all), mn = Math.min(0, ...all);
  if (mx === mn) mx = mn + 1; const sc = (v) => pt + (mx - v) / (mx - mn) * (H - pt - pb);
  const n = labels.length, gw = (W - pl - pr) / n, bw = Math.min(26, gw * 0.8 / series.length);
  let g = "";
  const ticks = 4; for (let i = 0; i <= ticks; i++) { const v = mn + (mx - mn) * i / ticks; const y = sc(v); g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="#EEF2F7"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end" font-size="10" fill="#94A3B8">${fmt(v / 1000)}k</text>`; }
  g += `<line x1="${pl}" x2="${W - pr}" y1="${sc(0)}" y2="${sc(0)}" stroke="#CBD5E1"/>`;
  labels.forEach((lb, i) => {
    const x0 = pl + i * gw + (gw - bw * series.length) / 2;
    series.forEach((s, j) => {
      const v = s.values[i]; const y = sc(Math.max(0, v)), y2 = sc(Math.min(0, v));
      const col = typeof s.color === "function" ? s.color(v, i) : s.color;
      g += `<rect x="${x0 + j * bw}" y="${y}" width="${bw - 2}" height="${Math.max(1, y2 - y)}" rx="3" fill="${col}"><title>${esc(s.name)} ${esc(lb)}: ${money(v)}</title></rect>`;
    });
    g += `<text x="${pl + i * gw + gw / 2}" y="${H - 14}" text-anchor="middle" font-size="10" fill="#64748B">${esc(lb)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}
function svgLine(labels, values, { h = 200, color = "#EA580C", area = true } = {}) {
  const W = 760, H = h, pl = 56, pr = 14, pt = 14, pb = 30;
  let mx = Math.max(...values, 0), mn = Math.min(...values, 0); if (mx === mn) mx = mn + 1;
  const sx = (i) => pl + i * (W - pl - pr) / Math.max(1, labels.length - 1), sy = (v) => pt + (mx - v) / (mx - mn) * (H - pt - pb);
  let g = ""; for (let i = 0; i <= 4; i++) { const v = mn + (mx - mn) * i / 4; g += `<line x1="${pl}" x2="${W - pr}" y1="${sy(v)}" y2="${sy(v)}" stroke="#EEF2F7"/><text x="${pl - 6}" y="${sy(v) + 4}" text-anchor="end" font-size="10" fill="#94A3B8">${fmt(v / 1000)}k</text>`; }
  g += `<line x1="${pl}" x2="${W - pr}" y1="${sy(0)}" y2="${sy(0)}" stroke="#CBD5E1"/>`;
  const pts = values.map((v, i) => `${sx(i)},${sy(v)}`).join(" ");
  if (area) g += `<polygon points="${sx(0)},${sy(0)} ${pts} ${sx(values.length - 1)},${sy(0)}" fill="${color}" opacity=".12"/>`;
  g += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>`;
  values.forEach((v, i) => { g += `<circle cx="${sx(i)}" cy="${sy(v)}" r="3.5" fill="#fff" stroke="${color}" stroke-width="2"><title>${esc(labels[i])}: ${money(v)}</title></circle>`; if (labels.length <= 14 || i % 2 === 0) g += `<text x="${sx(i)}" y="${H - 10}" text-anchor="middle" font-size="10" fill="#64748B">${esc(labels[i])}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>`;
}
function svgDonut(pct, color, label, sub) {
  const r = 52, c = 2 * Math.PI * r, p = Math.max(0, Math.min(1, pct));
  return `<svg viewBox="0 0 140 140" width="140" height="140"><circle cx="70" cy="70" r="${r}" fill="none" stroke="#EEF2F7" stroke-width="14"/>
  ${p > 0.005 ? `<circle cx="70" cy="70" r="${r}" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${c * p} ${c}" transform="rotate(-90 70 70)"/>` : ""}
  <text x="70" y="68" text-anchor="middle" font-size="22" font-weight="800" fill="#0F172A">${label}</text><text x="70" y="88" text-anchor="middle" font-size="11" fill="#64748B">${sub || ""}</text></svg>`;
}

  const f = FORM; if (f.tipo !== "Gasto" || !(+f.monto > 0) || (!f.categoria && !f.descripcion)) return "";
  try {
    const r = recomendarTarjeta(S.data, S.R, { monto: f.monto, moneda: f.moneda, categoria: f.categoria, descripcion: f.descripcion, fecha: f.fecha });
    const best = r.find(x => x.alcanza && x.desc > 0); const cur = r.find(x => x.c.nombre === f.medio);
    if (best && (!cur || cur.desc < best.desc)) return `💡 Con la <b>${esc(best.c.nombre)}</b> tenés ${esc(best.bTxt)} → ahorrás ~${money(best.desc)}${f.medio && f.medio !== best.c.nombre ? ` (con ${esc(f.medio)} no hay descuento)` : ""}.`;
    if (cur && cur.desc > 0) return `🎁 Bien: con la ${esc(cur.c.nombre)} tenés ${esc(cur.bTxt)} (~${money(cur.desc)}).`;
  } catch (e) { }
  return "";
}
function previewText() {
  const f = FORM; const mo = f.moneda === "USD" ? "U$S " : "$ ";
  if (!f.fecha || !f.descripcion || !f.monto) return "👀 Así queda: completá fecha, descripción y monto" + (f.tipo === "Gasto" ? " (y el medio de pago)." : ".");
  const r = E.movRow({ fecha: f.fecha, tipo: f.tipo, monto: +f.monto, medio: f.medio, cuotas: f.cuotas ? +f.cuotas : null, moneda: f.moneda }, S.data);
  if (f.tipo !== "Gasto") return `👀 Así queda: ingreso (${f.tipo}) de ${f.persona} por ${mo}${fmt(+f.monto, 2)} en ${E.mesLargo(r.mes)}${["Sueldo", "Aguinaldo", "SRV", "Licencia"].includes(f.tipo) ? " — reemplaza el estimado de ese mes" : ""}.`;
  if (!f.medio) return "👀 Así queda: elegí el medio de pago.";
  if (r.card) return `👀 Así queda: ${f.medio} → ${r.card.n} cuota(s) de ${mo}${fmt(r.card.v, 2)}, resumen de ${E.mesLargo(r.card.k)}${r.card.n > 1 ? " a " + E.mesLargo(r.card.o) : ""}.`;
  return `👀 Así queda: gasto de ${mo}${fmt(+f.monto, 2)} en ${f.medio}, mes de ${E.mesLargo(r.mes)}.`;
}
function bindCargar(root) {
  root.querySelectorAll("[data-tipo]").forEach(b => b.onclick = () => { FORM.tipo = b.dataset.tipo; if (FORM.tipo !== "Gasto") { FORM.categoria = FORM.categoria || "Otros"; } render(); });

function addMov() {
  const f = FORM;
  if (!f.fecha || !f.descripcion || !f.monto) { toast("Completá fecha, descripción y monto"); return; }
  if (!f.medio) { toast(f.tipo === "Gasto" ? "Elegí el medio de pago" : "Elegí la cuenta donde entra"); return; }

function modal(title, fields, obj, onSave, extraBtn) {
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal"><h2>${title}</h2><div class="mgrid">${fields.map(([k, l, t, o]) => `<div class="fld" ${t === "area" ? 'style="grid-column:span 2"' : ""}><label>${l}</label>${t === "sel" ? `<select data-k="${k}">${opts(o, obj[k])}</select>` : t === "area" ? `<textarea data-k="${k}" rows="3">${esc(obj[k])}</textarea>` : `<input data-k="${k}" type="${t === "num" ? "number" : t}" step="any" value="${esc(obj[k] ?? "")}">`}</div>`).join("")}</div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px">${extraBtn ? `<button class="btn danger" id="mx">${extraBtn[0]}</button><div class="spacer"></div>` : ""}<button class="btn" id="mc">Cancelar</button><button class="btn blue" id="ms">Guardar</button></div></div>`;
  document.body.appendChild(bg);
  bg.querySelector("#mc").onclick = () => bg.remove();
  bg.onclick = (e) => { if (e.target === bg) bg.remove(); };
  if (extraBtn) bg.querySelector("#mx").onclick = () => { bg.remove(); extraBtn[1](); };
  bg.querySelector("#ms").onclick = () => {
    const v = {}; bg.querySelectorAll("[data-k]").forEach(el => { const f = fields.find(x => x[0] === el.dataset.k); let x = el.value; if (f[2] === "num") x = x === "" ? null : +x; if (x === "") x = null; v[el.dataset.k] = x; });
    bg.remove(); onSave(v);
  };
}

async function geminiModels() {

VIAJES Y COMPRAS EN EL EXTERIOR: usá "Condiciones de las tarjetas". Al elegir tarjeta para una compra en el exterior o en una web en dólares, sumá el recargo de cada tarjeta (una sin recargo puede convenir más). Si preguntan por gastar en un viaje, cuánto les va a costar o si conviene refinanciar en cuotas las compras del exterior, pedí el cálculo con {"respuesta":"","acciones":[],"calculo":{"tipo":"refinanciar","monto":0,"moneda":"USD","tarjeta":"nombre exacto","cuotas":0}} (cuotas 0 = mostrar varias opciones). Recordá: conviene pagar los dólares en dólares, y refinanciar al 6% es mucho más barato que pagar el mínimo.
TARJETA: SIEMPRE que hablen de una compra que van a hacer (¿me lo puedo permitir?, quiero comprar X, ¿en cuotas o contado?, simulaciones, regalos, viajes), además de responder lo que preguntan, recomendá con qué tarjeta pagarla y por qué (días hasta pagarla, disponible, beneficio del día, puntos, cuánto queda usada). Para eso pedí el cálculo a la app con {"respuesta":"","acciones":[],"calculo":{"tipo":"tarjeta","monto":0,"moneda":"UYU|USD","descripcion":"","categoria":"","cuotas":1}} (si no dicen el monto, estimalo y aclaralo). Si una tarjeta cierra en 1 a 3 días, decilo y sugerí esperar o usar otra. No hace falta para gastos que ya hicieron y están cargando.
COSTUMBRES: usá "Costumbres" para completar categoría y medio cuando el usuario no los dice. Si en un ticket no se ve el medio de pago pero ese comercio se pagó SIEMPRE con el mismo medio (2 veces o más), usalo, no lo pongas en "faltan" y aclaralo en la respuesta ("lo puse con la X, como siempre").
Acciones posibles (proponelas SOLO cuando el usuario pide cargar, anotar, pagar, crear, borrar, corregir o actualizar un precio, o cuando manda un ticket, factura o resumen):
1) {"tipo":"movimiento","fecha":"YYYY-MM-DD","tipoMov":"Gasto|Sueldo|Aguinaldo|SRV|Licencia|Ingreso extra","descripcion":"","categoria":"","persona":"","moneda":"UYU|USD","monto":0,"medio":"","cuotas":1}
   - Gastos nuevos y tickets. Si es con tarjeta, medio = nombre exacto de la tarjeta y cuotas (1 si no dice). Si es en efectivo o débito, medio = Efectivo o la cuenta, y cuotas = null.
   - Ingresos (sueldo cobrado, aguinaldo, etc.): tipoMov correspondiente, medio = la cuenta donde entra.
2) {"tipo":"compra_tarjeta","tarjeta":"","fecha":"YYYY-MM-DD","comercio":"","categoria":"","persona":"","moneda":"UYU|USD","valorCuota":0,"cuotas":0,"cuotaInicial":0,"resumen":"YYYY-MM"}
   - SOLO para compras en cuotas que YA venían de antes y aparecen en un resumen como "cuota 3/10": cuotaInicial = 3, cuotas = 10, valorCuota = importe de la cuota, resumen = mes del resumen.
3) {"tipo":"pago_tarjeta","tarjeta":"","resumen":"YYYY-MM","monto":0,"moneda":"UYU|USD"}
   - Cuando dice que pagó una tarjeta. resumen = el resumen que está pagando (el que está "A pagar" o el actual). Si dice "pagué el total", usá el saldo de ese resumen.
4) {"tipo":"meta","nombre":"","moneda":"UYU|USD","objetivo":0,"fecha":"YYYY-MM-DD","ahorrado":0}
5) {"tipo":"canje_puntos","programa":"soy|brou|bbva|pronto|pass","puntos":0,"descripcion":""}  — cuando dice que usó/canjeó puntos.
6) {"tipo":"puntos_saldo","programa":"soy|brou|bbva|pronto|pass","saldo":0}  — cuando dice cuántos puntos tiene hoy según el banco.
7) {"tipo":"borrar_movimiento","id":"","descripcion":"","monto":0,"moneda":"UYU","fecha":"YYYY-MM-DD"}  — cuando pide borrar, eliminar, sacar o deshacer algo que ya está cargado (por ejemplo "borrá el árbol de navidad", "me equivoqué, sacalo"). Buscalo en "Últimos movimientos cargados" y usá su id EXACTO; copiá descripción, monto, moneda y fecha para que se vea qué se borra. Si hay varios que coinciden y no queda claro cuál, preguntá cuál (o proponé borrar solo el más reciente si dice "el último"). Si no lo encontrás, decilo.
8) {"tipo":"editar_movimiento","id":"","descripcion":"","cambios":{"campo":"valor nuevo"}}  — cuando pide corregir algo ya cargado (monto, fecha, medio, cuotas, categoría, persona, descripción). Campos válidos en "cambios": fecha, descripcion, categoria, persona, moneda, monto, medio, cuotas.
9) {"tipo":"ajustar_precio","lista":"fijos|ingresos","nombre":"","montoNuevo":0,"moneda":"UYU|USD","desde":"YYYY-MM"}  — cuando dice que algo fijo aumentó o bajó de precio, o que le cambió el sueldo (por ejemplo "UTE aumentó a 2.400", "el colegio sube a 19.000 desde marzo", "me aumentaron el sueldo a 65.000"). Usá el nombre EXACTO de "Gastos fijos e ingresos guardados". "desde" = mes desde el que rige el precio nuevo; si no lo dice, usá el mes actual (${todayKey()}). Los meses anteriores quedan con el precio viejo. Si no está claro cuál es, preguntá.
10) {"tipo":"fijar_dia","nombre":"","dia":0}  — cuando dice qué día se le cobra o debita algo fijo ("Claude se cobra el 21", "Netflix me lo debitan el 19"). Usá el nombre de "Gastos fijos e ingresos guardados". La app lo guarda y lo usa en el calendario.
FECHAS DE DÉBITO: si preguntan cuándo se cobra o debita algo (Netflix, Claude, UTE…), respondé con "Débitos automáticos": el día, la próxima fecha, el monto y en qué resumen de tarjeta entra y cuándo se paga. Si dice "DÍA DESCONOCIDO", decilo y pedí que te digan el día (y ofrecé guardarlo con fijar_dia). Si el día es "aprendido de 1 cargo", aclaralo como aproximado.
   - Para borrar o corregir NUNCA digas que ya lo hiciste ni que "no lo vas a tener en cuenta": la app lo hace cuando el usuario toca el botón de confirmar. En "respuesta" decí qué vas a borrar o cambiar y pedí que confirme.
Reglas: fecha por defecto hoy (${todayISO()}); moneda por defecto UYU; persona por defecto ${S.user && d.config.personas.includes(S.user.nombre) ? S.user.nombre : d.config.personas[0]} (quien está usando la app). Usá nombres EXACTOS de las listas. Si falta un dato clave (monto o con qué pagó), NO inventes: preguntalo en "respuesta" y dejá "acciones" vacío. En un resumen de tarjeta, cargá cada consumo del período como "movimiento" (medio = esa tarjeta, cuotas = 1 salvo que diga otra cosa) y las cuotas de compras viejas como "compra_tarjeta"; ignorá pagos, saldos anteriores e intereses salvo que te lo pidan. En "respuesta" resumí brevemente qué vas a cargar y pedí que confirme. Si no hay nada para cargar, "acciones": [].

## FOTOS DE TICKETS O FACTURAS
Cuando llega una foto o PDF de un ticket/factura de compra, leé: comercio (descripcion), fecha, TOTAL final pagado (no subtotales), moneda, y elegí la categoría más lógica. Buscá cómo se pagó: "EFECTIVO", "CRÉDITO", "DÉBITO", marca (VISA, MASTER, OCA…), últimos 4 dígitos (****1234 o XXXX1234) y "CUOTAS".
- Si los últimos 4 dígitos coinciden con una tarjeta de la lista, usá esa tarjeta como medio. Si dice débito, usá la cuenta bancaria que corresponda (si no está claro, preguntá).
- Proponé SIEMPRE la acción "movimiento" con todo lo que sí pudiste leer, y agregale "faltan": [lista de campos que NO pudiste deducir con seguridad], usando solo estos nombres: "medio" (no se sabe con qué pagó) y "cuotas" (pagó con tarjeta de crédito pero no se ve en cuántas cuotas). Si el ticket muestra todo, "faltan": [].
- En "respuesta" decí en una línea qué leíste (comercio, total, fecha) y, si falta algo, hacé la pregunta corta (por ejemplo "¿Lo pagaste en efectivo o con tarjeta?" o "¿En cuántas cuotas?"). La app le muestra botones para contestar y un botón Agregar.
- Si la foto no se lee o no es un ticket, decilo y no propongas acciones.

## ESTADOS DE CUENTA DE TARJETA (revisión)
Cuando manden un estado de cuenta (resumen) de una tarjeta, NO cargues todo de nuevo: compará cada línea con "Ya cargado en cada tarjeta" (misma tarjeta, fecha parecida ±3 días y mismo importe o misma cuota).
- Lo que ya está cargado: no lo propongas.
- Lo que falta (cargos del banco, seguros, comisiones, intereses, IVA, compras que no se cargaron): proponelo como "movimiento" con medio = esa tarjeta (las cuotas de compras viejas como "compra_tarjeta").
- Si algo está cargado con otro monto: proponé "editar_movimiento" con su id (si tiene id).
- En "respuesta" arrancá con un resumen así: "✅ Coinciden N · ➕ Faltan M · ⚠️ Diferencias K", y después una línea por cada cosa que falta o difiere.`;

function isDup(a) {
  if (a.tipo === "movimiento") {
    const f = a.fecha ? new Date(a.fecha).getTime() : 0;
    if (S.data.movimientos.some(m => Math.abs((+m.monto || 0) - (+a.monto || 0)) < 0.6 && m.medio === a.medio && Math.abs(new Date(m.fecha).getTime() - f) <= 3 * 864e5)) return true;
    const card = S.data.tarjetas.find(t => t.nombre === a.medio);
    if (card && card.compras.some(c => c.fecha && Math.abs(new Date(c.fecha).getTime() - f) <= 3 * 864e5 && (Math.abs((+c.total || 0) - (+a.monto || 0)) < 0.6 || Math.abs((+c.valorCuota || 0) - (+a.monto || 0)) < 0.6))) return true;
  }
  if (a.tipo === "compra_tarjeta") { const card = S.data.tarjetas.find(t => t.nombre === a.tarjeta); return !!(card && card.compras.some(c => Math.abs((+c.valorCuota || 0) - (+a.valorCuota || 0)) < 0.6 && +c.cuotas === +a.cuotas)); }
  return false;
}
function faltaDe(a) {
  if (a.tipo !== "movimiento" || a._hecho || a._desc) return null;
  const f = a.faltan || [];
  if (!a.medio || !L.medios().includes(a.medio) || (f.includes("medio") && !a._okMedio)) return "medio";
  if (L.isCard(a.medio) && (!(+a.cuotas > 0) || (f.includes("cuotas") && !a._okCuotas))) return "cuotas";
  if (!(+a.monto > 0)) return "monto";
  return null;
}

async function fileToAdj(f) {
  const raw = await new Promise(res => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.readAsDataURL(f); });
  if (/^image\//.test(f.type) && f.size > 600e3) {
    try {
      const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = raw; });
      const k = Math.min(1, 1800 / Math.max(img.width, img.height)); const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      return { name: f.name || "foto.jpg", mime: "image/jpeg", data: cv.toDataURL("image/jpeg", 0.85).split(",")[1] };
    } catch (e) { }
  }
  return { name: f.name || "archivo", mime: f.type || "application/pdf", data: raw.split(",")[1] };
}

// --- puntos estimados
function gastoTarjetaDesde(d, cardIds, desdeISO, hastaISO) {
  const TC = +d.config.tc || 0; let s = 0;
  d.movimientos.forEach(m => { const c = d.tarjetas.find(t => t.nombre === m.medio); if (!c || !cardIds.includes(c.id) || (m.tipo && m.tipo !== "Gasto")) return; if (m.fecha > desdeISO && m.fecha <= hastaISO) s += (+m.monto || 0) * (m.moneda === "USD" ? TC : 1); });
  d.tarjetas.filter(t => cardIds.includes(t.id)).forEach(c => c.compras.forEach(x => { if (x.fecha && x.fecha > desdeISO && x.fecha <= hastaISO && !x.cuotaInicial) s += (+x.total || (+x.valorCuota || 0) * (+x.cuotas || 1)) * (x.moneda === "USD" ? TC : 1); }));
  // débitos automáticos / gastos fijos: se cuentan en cada cierre posterior a la fecha base
  d.fijos.forEach(f => { const c = d.tarjetas.find(t => t.nombre === f.medio); if (!c || !cardIds.includes(c.id)) return;
    let m = desdeISO.slice(0, 7); for (let i = 0; i < 24; i++) { const k = E.addM(m, i); const ci = `${k}-${String(Math.min(c.cierre, 28)).padStart(2, "0")}`; if (ci <= desdeISO) continue; if (ci > hastaISO) break; s += E.fijoMonto(f, k, d, S.R ? S.R.movs : []) * (f.moneda === "USD" ? TC : 1); } });
  return s;
}
function puntosInfo(d) {
  const hoy = todayISO();
  return (d.programas || []).map(p => {
    const gasto = gastoTarjetaDesde(d, p.tarjetas, p.fechaBase, hoy);
    const ganados = Math.floor(gasto / (+p.pesosPorPunto || 100));
    const canj = (d.canjes || []).filter(c => c.programa === p.id && c.fecha >= p.fechaBase).reduce((s, c) => s + (+c.puntos || 0), 0);
    const total = (+p.saldo || 0) + ganados - canj;
    return { p, gasto, ganados, canj, total, valor: p.valorPunto ? total * p.valorPunto : null };
  });
}

function recomendarTarjeta(d, R, { monto, moneda, categoria, descripcion, fecha, cuotas }) {
  const TC = +d.config.tc || 0; const m$ = (+monto || 0) * (moneda === "USD" ? TC : 1); fecha = fecha || todayISO();
  const progs = d.programas || [];
  const res = R.cards.map(ci => {
    const c = ci.card; const f = new Date(fecha + "T12:00:00");
    const k = f.getDate() <= c.cierre ? fecha.slice(0, 7) : E.addM(fecha.slice(0, 7), 1);
    const o = ci.res.find(x => x.mes === k);
    const vence = o ? new Date(o.vence) : null; const dias = vence ? Math.round((vence - f) / 864e5) : null;
    const bens = beneficiosPara(d, c.id, { categoria, descripcion, fecha });
    let desc = 0, bTxt = "";
    bens.forEach(b => { if (b.pct) { const v = Math.min(m$ * b.pct / 100, b.tope || Infinity); if (v > desc) { desc = v; bTxt = b.detalle + (b.topeTxt ? ` (${b.topeTxt})` : ""); } } else if (!bTxt) bTxt = b.detalle; });
    const pr = progs.find(p => p.tarjetas.includes(c.id)); const pts = pr ? Math.floor(m$ / (+pr.pesosPorPunto || 100)) : 0; const ptsVal = pr && pr.valorPunto ? pts * pr.valorPunto : pts * 0.3;
    const alcanza = ci.disponible >= m$; const pctDesp = ci.limite ? (ci.usado + m$) / ci.limite : 1;
    let score = desc + ptsVal + (dias || 0) * m$ * 0.0007 - (pctDesp > 0.8 ? m$ * 0.05 : 0) - (c.limite ? 0 : 1e9);
    if (!alcanza) score -= 1e9;
    return { ci, c, k, vence, dias, bens, desc, bTxt, pr, pts, ptsVal, alcanza, pctDesp, score };
  }).sort((a, b) => b.score - a.score);
  return res;
}
function textoRecomendacion(r, monto$, moneda) {
  const best = r[0]; if (!best || !best.alcanza) return "Ninguna tarjeta tiene disponible suficiente para esta compra.";

// --- avisos de tarjetas para hoy
function avisosTarjetasHoy(d, R) {
  const out = []; const T = new Date(); const t0 = Date.UTC(T.getFullYear(), T.getMonth(), T.getDate()); const DAY = 864e5;
  R.cards.forEach(ci => {
    const c = ci.card;

      const saldo = o.saldoUYU + o.saldoUSD * (+d.config.tc || 0);
      if (saldo > 1 && dv < 0 && dv >= -40) out.push({ tipo: "rojo", prio: 1, txt: `La ${c.nombre} venció el ${fmtTs(o.vence)} y figura sin pagar ${money(saldo)}. Si ya la pagaste, anotá el pago (en Tarjetas o diciéndoselo al asesor).` });
      else if (saldo > 1 && dv >= 0 && dv <= 3 && t0 >= (o.desde || 0)) out.push({ tipo: "naranja", prio: 2, txt: `La ${c.nombre} vence ${dv === 0 ? "HOY" : dv === 1 ? "mañana" : "en " + dv + " días (" + fmtTs(o.vence) + ")"} y faltan ${money(saldo)} por pagar.` });
      const dc = Math.round((o.cierre - t0) / DAY);
      if (dc >= 0 && dc <= 3) out.push({ tipo: "info", prio: 4, txt: `La ${c.nombre} cierra ${dc === 0 ? "hoy" : dc === 1 ? "mañana" : "en " + dc + " días"}: lo que compres después entra en el resumen de ${E.mesLargo(E.addM(o.mes, 1))} (más tiempo para pagar).` });
    });
    const cur = ci.actual.mes;
    ci.rows.forEach(({ c: x, g }) => { if (+x.cuotas > 1 && g.o === cur && x.categoria !== "Cargos bancarios") out.push({ tipo: "verde", prio: 5, txt: `En el resumen de ${E.mesLargo(cur)} de la ${c.nombre} termina la última cuota de ${x.comercio}: después tenés ${money(g.v)} más por mes.` }); });
  });
  beneficiosHoy(d).slice(0, 3).forEach(b => out.push({ tipo: "verde", prio: 3, txt: `🎁 Hoy ${DIAS[diaSem()]}: ${b.detalle} con la ${b.tarjetas.map(id => (d.tarjetas.find(t => t.id === id) || {}).nombre).join(" / ")}${b.topeTxt ? " (" + b.topeTxt + ")" : ""}.` }));
  return out.sort((a, b) => a.prio - b.prio);
}

function ahorroBeneficios(d, mes) {

// ---------- Avisos push en el celular
const FN_AVISOS = CLOUD.url + "/functions/v1/avisos";
const b64u8 = (s) => { const p = "=".repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from([...b].map(ch => ch.charCodeAt(0))); };
const esIOS = () => /iPhone|iPad|iPod/i.test(navigator.userAgent);
const esInstalada = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
async function estadoAvisos() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) return esIOS() && !esInstalada() ? "ios-instalar" : "no-soporta";
  if (Notification.permission === "denied") return "bloqueado";
  try { const reg = await navigator.serviceWorker.ready; const s = await reg.pushManager.getSubscription(); return s ? "activo" : "inactivo"; } catch (e) { return "inactivo"; }
}
async function activarAvisos() {
  const st = await estadoAvisos(); if (st === "ios-instalar") { toast("En iPhone: primero agregá la app a la pantalla de inicio y abrila desde ahí"); return; }
  if (st === "no-soporta") { toast("Este navegador no permite avisos"); return; }
  const perm = await Notification.requestPermission(); if (perm !== "granted") { toast("No diste permiso para los avisos"); renderAvisosCfg(); return; }
  try {
    const reg = await navigator.serviceWorker.ready;
    const k = await (await fetch(FN_AVISOS, { method: "POST", headers: { "Content-Type": "application/json", apikey: CLOUD.key }, body: '{"tipo":"clave"}' })).json();
    if (!k.publicKey) throw new Error(k.error || "sin clave");
    let sub = await reg.pushManager.getSubscription(); if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u8(k.publicKey) });
    const j = sub.toJSON();
    const r = await sb.from("push_subs").upsert({ endpoint: j.endpoint, hogar_id: S.hogar, user_id: S.user.id, nombre: S.user.nombre, p256dh: j.keys.p256dh, auth: j.keys.auth, prefs: { avisos: true, cargas: true } }); if (r.error) throw r.error;
    await probarAvisos(); toast("🔔 Avisos activados en este celular");
  } catch (e) { toast("No se pudieron activar: " + e.message); }
  renderAvisosCfg();
}
async function probarAvisos() {
  const { data } = await sb.auth.getSession();
  await fetch(FN_AVISOS, { method: "POST", headers: { "Content-Type": "application/json", apikey: CLOUD.key, Authorization: "Bearer " + data.session.access_token }, body: '{"tipo":"prueba"}' });
}
async function desactivarAvisos() {
  try { const reg = await navigator.serviceWorker.ready; const s = await reg.pushManager.getSubscription(); if (s) { await sb.from("push_subs").delete().eq("endpoint", s.endpoint); await s.unsubscribe(); } toast("Avisos desactivados en este celular"); } catch (e) { toast(e.message); }
  renderAvisosCfg();
}
async function renderAvisosCfg() {
  const el = $("#avisosCfg"); if (!el) return; const st = await estadoAvisos();
  const txt = { activo: "✅ Activados en este celular. Te avisa: tarjetas que vencen en 3 días o menos, cierres, lo que cargue el otro y un resumen los lunes.", inactivo: "Todavía no están activados en este celular.", bloqueado: "Bloqueaste los avisos para esta app. Habilitalos en los ajustes del navegador (Notificaciones) y volvé acá.", "ios-instalar": "En iPhone los avisos funcionan solo con la app agregada a la pantalla de inicio: en Safari tocá Compartir → «Agregar a inicio» y abrila desde ese ícono.", "no-soporta": "Este navegador no permite avisos." }[st];
  el.innerHTML = `<div class="small" style="margin-bottom:8px">${txt}</div>${st === "activo" ? `<button class="btn sm" onclick="probarAvisos().then(()=>toast('Te mandé un aviso de prueba'))">Mandar uno de prueba</button> <button class="btn sm danger" onclick="desactivarAvisos()">Desactivar</button>` : st === "inactivo" ? `<button class="btn blue" onclick="activarAvisos()">🔔 Activar avisos en este celular</button>` : ""}`;
}

// ===================== EXTRAS: plata extra, intereses, topes, gastos hormiga, resumen semanal =====================
const TOPES_INI = { "Delivery y comida afuera": 3000, "Salidas y ocio": 2500, "Ropa y calzado": 3500, "Compras online": 2500, "Hogar y ferretería": 2000 };
function migrateV3(d) {
  if ((d.migVer || 0) >= 3) return;
  d.config.topes = d.config.topes || Object.assign({}, TOPES_INI);
  d.reservas = d.reservas || [];
  d.migVer = 3;
}
const uyuEq = (mo, v) => (+v || 0) * (mo === "USD" ? (+S.data.config.tc || 0) : 1);

// ---------- 1) Plata extra / que sobra: plan para repartirla
function extraDelMes(m) {
  const R = S.R, p = R.proy.find(x => x.mes === m); if (!p) return null;
  const ingExtra = p.detIng.filter(x => !x.reemplazado && !x.reserva && !/^Sueldo/i.test(x.nombre)).reduce((s, x) => s + x.v, 0)
    + S.data.movimientos.filter(mv => (mv.fecha || "").slice(0, 7) === m && mv.tipo && !["Gasto", "Sueldo"].includes(mv.tipo)).reduce((s, mv) => s + uyuEq(mv.moneda, mv.monto), 0);
  return { p, ingExtra, sobra: p.J };
}
function planExtra(m) {
  const info = extraDelMes(m); if (!info) return null;
  const R = S.R, d = S.data, k = R.months.indexOf(m);
  let resto = Math.floor(info.sobra / 100) * 100; const items = [];
  if (resto < 1000) return { info, items, resto: 0 };
  R.proy.slice(k + 1, k + 7).forEach(x => {
    if (x.J < 0 && resto > 0) { const v = Math.min(resto, Math.ceil(-x.J / 100) * 100); items.push({ tipo: "mes", para: x.mes, monto: v, txt: "Guardar para " + E.mesLargo(x.mes), sub: `ese mes faltan ${money(-x.J)}` }); resto -= v; }
  });
  const A = E.asesor(d, R, m);
  if (resto > 0 && A.faltaFondo > 0) { const v = Math.min(A.faltaFondo, Math.round(resto * 0.6 / 100) * 100); if (v > 0) { items.push({ tipo: "meta", meta: "Fondo de emergencia", monto: v, txt: "Fondo de emergencia", sub: `te faltan ${money(A.faltaFondo)} para la meta` }); resto -= v; } }
  const metas = d.ahorro.filter(a => !/emergencia/i.test(a.nombre) && +a.objetivo > +a.ahorrado && a.moneda !== "USD");
  if (resto > 0 && metas.length) {
    const cupo = Math.round(resto * 0.7 / 100) * 100; const c1 = Math.floor(cupo / metas.length / 100) * 100;
    metas.forEach(a => { const v = Math.min(c1, (+a.objetivo) - (+a.ahorrado || 0)); if (v > 0) { items.push({ tipo: "meta", meta: a.nombre, monto: v, txt: "Meta: " + a.nombre, sub: `faltan ${money(+a.objetivo - (+a.ahorrado || 0))}` }); resto -= v; } });
  }
  return { info, items, resto };
}
function cardExtra() {
  const m = S.mes; const d = S.data; const aplicadas = (d.reservas || []).filter(r => r.de === m);
  if (aplicadas.length) {
    const tot = aplicadas.reduce((s, r) => s + (+r.monto || 0), 0);

// ---------- 2) Lo que cuestan los intereses
const RX_INT = /inter[eé]s|recargo|mora\b|punitorio|financiaci[oó]n/i;
function intereses() {
  const R = S.R, d = S.data, hoyK = todayKey(), anio = hoyK.slice(0, 4); const out = [];
  R.cards.forEach(ci => ci.rows.forEach(({ c, g }) => {
    if (!RX_INT.test(c.comercio || c.descripcion || "")) return;
    for (let mm = g.k; mm <= g.o; mm = E.addM(mm, 1)) out.push({ tarjeta: ci.card.nombre, mes: mm, txt: c.comercio || c.descripcion, v: uyuEq(c.moneda, g.v) });
  }));
  d.movimientos.forEach(mv => { if (mv.tipo === "Gasto" && !L.isCard(mv.medio) && RX_INT.test(mv.descripcion || "")) out.push({ tarjeta: mv.medio, mes: (mv.fecha || "").slice(0, 7), txt: mv.descripcion, v: uyuEq(mv.moneda, mv.monto) }); });
  const pagados = out.filter(x => x.mes.slice(0, 4) === anio && x.mes < hoyK), proximos = out.filter(x => x.mes >= hoyK);
  const sum = a => a.reduce((s, x) => s + x.v, 0);
  return { lista: out, anio, pagado: sum(pagados), proximo: sum(proximos), proximos, pagados };
}
function costoMil(tea) { return 1000 * (Math.pow(1 + (+tea || 0), 1 / 12) - 1) * 1.22; }

// ---------- 4) Topes por categoría (gasto por fecha de compra)
function gastoCompraMes(m) {

  S.data.tarjetas.forEach(t => (t.compras || []).forEach(c => {
    if ((c.fecha || "").slice(0, 7) !== m || (+c.cuotaInicial || 1) > 1 || RX_INT.test(c.comercio || "") || /Cargos bancarios|Préstamos/.test(c.categoria || "")) return;
    const v = +c.total > 0 ? +c.total : (+c.valorCuota || 0) * (+c.cuotas || 1); const k = c.categoria || "Otros"; out[k] = (out[k] || 0) + uyuEq(c.moneda, v);

// ---------- Gastos hormiga (últimos 30 días)
function normCom(s) {
  return String(s || "").toLowerCase().replace(/\(.*?\)/g, " ").replace(/merpago|mercadopago|mercado pago|sucursal|\d+/g, " ").replace(/[^a-záéíóúñü ]/g, " ").replace(/\s+/g, " ").trim().split(" ").filter(w => w.length > 2).slice(0, 2).join(" ");
}
function hormiga(dias = 30) {
  const lim = new Date(Date.now() - dias * 864e5).toISOString().slice(0, 10); const G = {};
  S.data.movimientos.forEach(mv => {
    if ((mv.tipo || "Gasto") !== "Gasto" || (mv.fecha || "") < lim) return; const v = uyuEq(mv.moneda, mv.monto); if (!(v > 0) || v > 1500) return;
    if (/Servicios del hogar|Educación|Salud|Préstamos|Cargos bancarios/.test(mv.categoria || "")) return;
    const k = normCom(mv.descripcion) || (mv.categoria || "otros").toLowerCase(); (G[k] = G[k] || { k, n: 0, v: 0, ej: mv.descripcion, cat: mv.categoria }).n++; G[k].v += v;
  });
  const porCat = {}; S.data.movimientos.forEach(mv => { if ((mv.tipo || "Gasto") !== "Gasto" || (mv.fecha || "") < lim) return; const v = uyuEq(mv.moneda, mv.monto); if (v > 0 && v <= 1500 && /Delivery|Salidas/.test(mv.categoria || "")) { const c = mv.categoria; (porCat[c] = porCat[c] || { k: c, n: 0, v: 0, ej: c, cat: c, esCat: true }).n++; porCat[c].v += v; } });
  const lista = Object.values(G).filter(x => x.n >= 3).sort((a, b) => b.v - a.v);
  const cats = Object.values(porCat).filter(x => x.n >= 4 && !lista.some(l => l.cat === x.k));
  const todo = [...lista, ...cats].slice(0, 6); const tot = todo.reduce((s, x) => s + x.v, 0);
  return { lista: todo, tot, anual: tot * 365 / dias, dias };
}
function hormigaHTML() {
  const H = hormiga();
  return `<div class="card" style="margin-bottom:16px"><h3>🐜 Gastos hormiga <span class="hint">últimos ${H.dias} días</span></h3>
    ${H.lista.length ? `<div class="small mut" style="margin-bottom:6px">Gastos chicos que se repiten. Solos no parecen nada, pero juntos suman.</div>
      ${H.lista.map(x => `<div class="rowbar"><span class="n">${esc(x.esCat ? x.k : x.ej)} <span class="mut tiny">· ${x.n} veces</span></span><span class="v">${money(x.v)}</span>${barHTML(x.v / H.lista[0].v, "#F59E0B")}</div>`).join("")}
      <div class="msg naranja" style="margin-top:10px"><span class="e">🐜</span><span>En ${H.dias} días suman <b>${money(H.tot)}</b>. A este ritmo son unos <b>${money(Math.round(H.anual / 1000) * 1000)}</b> por año.</span></div>`
    : `<div class="msg verde"><span class="e">🎉</span><span>No hay gastos hormiga en los últimos ${H.dias} días: nada chico que se repita 3 veces o más.</span></div>`}</div>`;
}

// ---------- 6) Resumen semanal (IA)
function claveSemana() { const t = new Date(); const dw = (t.getDay() + 6) % 7; const mon = new Date(t.getFullYear(), t.getMonth(), t.getDate() - dw); return mon.toISOString().slice(0, 10); }
function datosSemana() {
  const d = S.data; const hoy = todayISO(); const ini = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10); const ini2 = new Date(Date.now() - 14 * 864e5).toISOString().slice(0, 10);
  const sem = d.movimientos.filter(m => (m.tipo || "Gasto") === "Gasto" && m.fecha > ini && m.fecha <= hoy), ant = d.movimientos.filter(m => (m.tipo || "Gasto") === "Gasto" && m.fecha > ini2 && m.fecha <= ini);
  const tot = a => a.reduce((s, m) => s + uyuEq(m.moneda, m.monto), 0); const cats = {}; sem.forEach(m => { const c = m.categoria || "Otros"; cats[c] = (cats[c] || 0) + uyuEq(m.moneda, m.monto); });
  const T = d.config.topes || {}, g = gastoCompraMes(todayKey());
  const H = hormiga(14); const venc = [];
  S.R.cards.forEach(ci => ci.res.forEach(o => { const dd = Math.round((o.vence - Date.UTC(new Date().getFullYear(), new Date().getMonth(), new Date().getDate())) / 864e5); if (dd >= 0 && dd <= 10 && (o.saldoUYU > 1 || o.saldoUSD > 0.01)) venc.push(`${ci.card.nombre} vence ${fmtTs(o.vence)} (${money(o.saldoUYU + o.saldoUSD * d.config.tc)})`); }));
  return `Semana del ${ini} al ${hoy}. Gastos cargados en la semana: ${money(tot(sem))} en ${sem.length} compras (semana anterior: ${money(tot(ant))}).
Por categoría: ${Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([c, v]) => c + " " + money(v)).join("; ") || "nada"}.
Las 3 compras más grandes: ${[...sem].sort((a, b) => uyuEq(b.moneda, b.monto) - uyuEq(a.moneda, a.monto)).slice(0, 3).map(m => `${m.descripcion} ${m.moneda === "USD" ? "U$S" : "$"} ${m.monto} (${m.persona || ""})`).join("; ") || "ninguna"}.
Topes del mes: ${Object.keys(T).map(k => `${k} ${money(g[k] || 0)} de ${money(T[k])}`).join("; ") || "sin topes"}.
Gastos hormiga (14 días): ${H.lista.map(x => `${x.esCat ? x.k : x.ej} ${x.n} veces ${money(x.v)}`).join("; ") || "ninguno"}.
Vencimientos de tarjetas en los próximos 10 días: ${venc.join("; ") || "ninguno"}.`;
}

// ===================== FINANZAS PERSONALES: manual del asesor + salud financiera
const MANUAL_FINANZAS = `MANUAL DE FINANZAS PERSONALES (usalo en todo consejo de ahorro, presupuesto, metas, compras o plata extra; adaptalo a SUS números):
1) Orden de prioridades (etapas): 1. Estabilizar: que ningún mes quede en rojo y nada en mora. 2. Colchón inicial de 1 mes de gastos. 3. Eliminar deudas caras (más de 30% anual, tarjetas financiadas, financieras). 4. Fondo de emergencia de 3 a 6 meses de gastos. 5. Metas (viaje, auto, casa, estudios de Mateo). 6. Largo plazo y retiro. Decí en qué etapa están y cuál es el próximo paso.
2) Pagarse primero: el ahorro se separa el día que cobran (transferencia automática a otra cuenta), no "lo que sobra a fin de mes". Empezar con poco (2–5% del ingreso) y subir cuando termina una cuota o hay aumento.
3) Presupuesto de referencia 50/30/20: 50% necesidades, 30% gustos, 20% ahorro y deudas. Es una guía, no una ley: comparalo con lo que ellos gastan y proponé ajustes chicos y concretos.
4) Indicadores sanos: ahorrar 10–20% de lo que entra; cuotas de deudas por debajo de 30–35% del ingreso; colchón de 3–6 meses. Si están lejos, celebrá cada avance chico.
5) Dónde guardar en Uruguay (orientativo, sin recomendar un banco o producto puntual): el colchón en algo disponible que no pierda contra la inflación (caja de ahorro en UI o plazo fijo corto); metas en pesos a más de 1 año: plazo fijo en pesos o UI, Letras de Regulación Monetaria o fondos que las compran, comparando la tasa contra la inflación (meta del BCU 4,5%); metas en dólares (viaje al exterior): comprar dólares de a poco cada mes, no todo junto. Ahorrar en dólares "por las dudas" a largo plazo suele rendir menos que en UI. Nada de cripto, apuestas ni "inversiones" que prometen mucho: para invertir con riesgo, un asesor registrado en el BCU.
6) Metas: con monto y fecha; cuánto por mes = lo que falta / meses que quedan. Separar cada meta (cuenta o sobre distinto) para no gastarla. Festejar al 25%, 50% y 75%.
7) Compras grandes: regla de las 48 horas antes de comprar; mirar el costo total y no solo la cuota; cuotas "sin recargo" solo si entran sin superponer muchas cuotas; nunca financiar en cuotas largas lo que se consume (súper, salidas, delivery).
8) Gastos chicos y suscripciones: revisarlos cada mes; lo que se recorta pasa directo al ahorro ese mismo día, si no se evapora.
9) Plata extra (aguinaldo, salario vacacional, devoluciones): primero tapar meses en rojo, después colchón o deuda cara, después metas; dejar 10–20% para un gusto para que el plan se sostenga.
10) Gastos que se ven venir (matrícula del colegio en diciembre, patente, seguros, cumpleaños, fiestas): dividir por 12 y separarlo cada mes para que no caiga todo junto.
11) Seguros: cubrir lo que no podrían pagar de golpe (hogar, auto, vida si hay quien depende de ellos); evitar seguros repetidos o los que vienen "de regalo" con préstamos y tarjetas sin revisar el costo.
12) En familia: una charla de 15 minutos por mes mirando esta app; con Mateo, una mesada o meta propia ayuda a que aprenda a manejar plata.
13) Tono: sin culpa ni sermones, concreto, con números de ellos y un paso para hacer hoy. Si algo es una decisión grande (préstamo, inversión, auto), mostrá las cuentas y aclará que la decisión es de ellos.`;

function saludFinanciera() {
  const R = S.R, d = S.data, k0 = R.months.indexOf(todayKey()), P = R.proy.slice(Math.max(0, k0), k0 + 12);
  const A = E.asesor(d, R, todayKey());
  const ing = P.reduce((s, x) => s + x.D, 0) / (P.length || 1), queda = P.reduce((s, x) => s + x.J, 0) / (P.length || 1);
  let cuotas = 0, ret = 0, caras = []; try { const D = deudas(); cuotas = D.reduce((s, x) => s + x.cuota, 0); ret = D.filter(x => /sueldo/i.test(x.forma || "")).reduce((s, x) => s + x.cuota, 0); caras = D.filter(x => x.tea > 0.3); } catch (e) { }
  const rojos = P.filter(x => x.J < 0).length, colchon = (A.avgEgr || 0) > 0 ? (A.fondo || 0) / A.avgEgr : 0;
  const ahorro = ing > 0 ? queda / ing : 0, pCuotas = ing + ret > 0 ? cuotas / (ing + ret) : 0; // las retenidas del sueldo ya vienen descontadas del ingreso
  const etapa = rojos ? 1 : colchon < 1 ? 2 : caras.length ? 3 : colchon < 3 ? 4 : 5;
  const ET = ["", "Estabilizar: que ningún mes quede en rojo", "Juntar un colchón de 1 mes de gastos", "Sacarse de encima las deudas caras", "Completar el fondo de emergencia (3 a 6 meses)", "Metas grandes y largo plazo"];
  const sem = (v, ok, med, inv) => (inv ? v <= ok : v >= ok) ? "verde" : (inv ? v <= med : v >= med) ? "amarillo" : "rojo";
  return { ing, queda, ahorro, cuotas, pCuotas, colchon, rojos, caras, etapa, ET, A,
    ind: [
      { k: "Lo que les queda", v: pct(ahorro), s: sem(ahorro, 0.1, 0, false), ref: "ideal 10–20% de lo que entra" },
      { k: "Cuotas de deudas", v: pct(pCuotas), s: sem(pCuotas, 0.3, 0.4, true), ref: "sano: menos de 30–35% del ingreso" },
      { k: "Colchón", v: (Math.round(colchon * 10) / 10).toLocaleString("es-UY") + " meses", s: sem(colchon, 3, 1, false), ref: "ideal 3 a 6 meses de gastos" },
      { k: "Meses en rojo (12)", v: String(rojos), s: rojos === 0 ? "verde" : rojos <= 2 ? "amarillo" : "rojo", ref: "ideal ninguno" }
    ] };
}

function contextoFinanzas() {
  try {
    const h = saludFinanciera();
    return `\n## Salud financiera (calculado por la app, promedio de los próximos 12 meses)
Entra por mes ${money(h.ing)}; les queda ${money(h.queda)} (${pct(h.ahorro)}). Cuotas de deudas ${money(h.cuotas)} = ${pct(h.pCuotas)} del ingreso (sueldo antes de retenciones). Colchón: ${(Math.round(h.colchon * 10) / 10)} meses de gastos. Meses en rojo: ${h.rojos}. Deudas caras (>30%): ${h.caras.map(x => x.nombre).join(", ") || "ninguna"}.
ETAPA ACTUAL: ${h.etapa}. ${h.ET[h.etapa]}${h.etapa < 5 ? ` (después: ${h.ET[h.etapa + 1]})` : ""}.

${MANUAL_FINANZAS}`;
  } catch (e) { return ""; }
}

function listaGastos() {
  const out = [];
  S.data.movimientos.forEach((mv, i) => {
    if ((mv.tipo || "Gasto") !== "Gasto" || !mv.fecha) return;
    out.push({ fecha: mv.fecha, desc: mv.descripcion || "", cat: mv.categoria || "", por: mv.persona || mv.por || "", medio: mv.medio || "", moneda: mv.moneda || "UYU", monto: +mv.monto || 0, cuotas: +mv.cuotas || 1, v: uyuEq(mv.moneda, +mv.monto || 0), mov: i });
  });
  S.data.tarjetas.forEach((t, ti) => (t.compras || []).forEach((c, ci) => {
    if (!c.fecha || (typeof RX_INT !== "undefined" && RX_INT.test(c.comercio || ""))) return;
    const tot = compraValor(c);
    out.push({ fecha: c.fecha, desc: c.comercio || "", cat: c.categoria || "", por: c.persona || "", medio: t.nombre, moneda: c.moneda || "UYU", monto: tot, cuotas: +c.cuotas || 1, v: uyuEq(c.moneda, tot), tarjeta: ti, viejo: (+c.cuotaInicial || 1) > 1 });

}

function diaLabel(f) {
