<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finanzas del Hogar</title>
<meta name="theme-color" content="#0B1B3A"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Finanzas">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex,nofollow">
<style>:root{
  --bg:#F3F5FA; --card:#FFFFFF; --ink:#0F172A; --muted:#64748B; --line:#E2E8F0;
  --navy:#0B1B3A; --navy2:#13285A; --blue:#2563EB; --green:#16A34A; --red:#DC2626; --amber:#F59E0B;
  --violet:#7C3AED; --orange:#EA580C; --teal:#0D9488; --soft-blue:#EFF6FF; --soft-green:#ECFDF5; --soft-red:#FEF2F2;
  --soft-amber:#FFFBEB; --soft-violet:#F5F3FF; --soft-orange:#FFF7ED; --radius:16px; --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;height:100vh;overflow:hidden}
/* sidebar */
.side{width:232px;flex:none;background:linear-gradient(180deg,var(--navy),var(--navy2));color:#CBD5E1;display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;color:#fff}
.brand .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#22C55E,#2563EB);display:grid;place-items:center;font-size:20px}
.brand b{display:block;font-size:15px;line-height:1.1}.brand span{font-size:11px;color:#94A3B8}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:14px;color:#CBD5E1}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:rgba(255,255,255,.13);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #22C55E}
.nav .ic{width:22px;text-align:center;font-size:16px}
.nav .badge{margin-left:auto;background:#DC2626;color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
.side .foot{margin-top:auto;font-size:11px;color:#94A3B8;padding:10px}
.side .foot .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22C55E;margin-right:6px}
.side .foot .dot.warn{background:#F59E0B}
/* main */
.main{flex:1;overflow:auto;padding:22px 28px 60px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.3px}
.top .sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
.monthsel{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
.monthsel button{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--muted);font-size:16px}
.monthsel button:hover{background:#F1F5F9;color:var(--ink)}
.monthsel select{border:0;background:transparent;font-weight:700;font-size:15px;padding:4px 6px;cursor:pointer;text-transform:capitalize}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.pill.red{background:#FEE2E2;color:#991B1B}.pill.green{background:#DCFCE7;color:#166534}.pill.amber{background:#FEF3C7;color:#92400E}
.pill.blue{background:#DBEAFE;color:#1E3A8A}.pill.gray{background:#F1F5F9;color:#475569}.pill.violet{background:#EDE9FE;color:#5B21B6}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
@media (max-width:1250px){.g4{grid-template-columns:repeat(2,1fr)}.g21,.g12,.g3{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;border:1px solid #EEF1F6;min-width:0}
.card h3{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .hint{font-weight:400;color:var(--muted);font-size:12px;margin-left:auto}
.kpi{position:relative;overflow:hidden;padding:18px 20px}
.kpi .lab{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;display:flex;gap:6px;align-items:center}
.kpi .val{font-size:30px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.kpi .foot{font-size:12px;color:var(--muted);margin-top:4px}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;opacity:.12;background:currentColor}
.kpi.k-green{color:var(--green)}.kpi.k-red{color:var(--red)}.kpi.k-blue{color:var(--blue)}.kpi.k-violet{color:var(--violet)}
.kpi .val,.kpi .foot,.kpi .lab{color:inherit}.kpi .foot{color:var(--muted)}.kpi .lab{color:var(--muted)}
.sema{font-size:26px;font-weight:800;border-radius:12px;padding:6px 14px;display:inline-block;margin-top:6px;color:#fff}
.sema.Rojo{background:var(--red)}.sema.Amarillo{background:#EAB308;color:#111}.sema.Verde{background:var(--green)}.sema.Sin{background:#94A3B8}
.neg{color:var(--red)!important}.pos{color:var(--green)!important}.mut{color:var(--muted)}
.bar{height:10px;border-radius:99px;background:#EEF2F7;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.rowbar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin:10px 0}
.rowbar .n{font-size:13px}.rowbar .v{font-weight:700;font-size:13px;text-align:right}.rowbar .bar{grid-column:1/3;height:8px}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.t th{position:sticky;top:0;background:#F8FAFC;color:#475569;font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);z-index:1;white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid #F1F5F9;vertical-align:middle}
table.t tr:hover td{background:#FAFCFF}
table.t td.r,table.t th.r{text-align:right;white-space:nowrap}table.t td.c,table.t th.c{text-align:center}
table.t tfoot td{font-weight:800;background:#F8FAFC;border-top:1px solid var(--line)}
.scroll{overflow:auto;max-height:560px;border-radius:12px;border:1px solid var(--line)}
.ed input,.ed select{width:100%;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;min-width:60px}
.ed input:hover,.ed select:hover{border-color:var(--line);background:#fff}
.ed input:focus,.ed select:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px #DBEAFE}
.ed input.num{text-align:right}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px;background:#fff;border:1px solid var(--line);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.btn:hover{background:#F8FAFC}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}.btn.pri:hover{filter:brightness(.95)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.big{padding:13px 26px;font-size:16px;border-radius:12px}
.icon-btn{all:unset;cursor:pointer;padding:4px 7px;border-radius:7px;color:var(--muted)}
.icon-btn:hover{background:#F1F5F9;color:var(--red)}
.form{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:10px;align-items:end}
.fld label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px #DBEAFE}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{all:unset;cursor:pointer;padding:7px 12px;border-radius:99px;border:1.5px solid var(--line);font-size:13px;font-weight:600;background:#fff}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.preview{margin-top:14px;padding:12px 16px;border-radius:12px;background:var(--soft-blue);color:#1E3A8A;font-weight:600;display:flex;align-items:center;gap:10px}
.addcard{border:2px solid #FDBA74;background:linear-gradient(180deg,#FFF7ED,#fff)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:#F1F5F9;color:#475569;font-weight:600;white-space:nowrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{all:unset;cursor:pointer;padding:10px 16px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.tabs button .sw{width:12px;height:12px;border-radius:4px}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.ccard{border-radius:18px;color:#fff;padding:20px 22px;min-height:170px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(15,23,42,.18)}
.ccard::before{content:"";position:absolute;right:-60px;bottom:-80px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.12)}
.ccard .bk{font-size:12px;opacity:.85;text-transform:uppercase;letter-spacing:1px}.ccard .nm{font-size:20px;font-weight:800;margin-top:4px}
.ccard .num{font-family:Consolas,monospace;letter-spacing:3px;margin-top:22px;opacity:.9}
.ccard .row{display:flex;gap:26px;margin-top:14px;font-size:12px}.ccard .row b{display:block;font-size:16px}
.tl{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.tlm{flex:none;width:150px;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}
.tlm.cur{border:2px solid var(--blue);box-shadow:0 0 0 4px #DBEAFE}
.tlm .m{font-weight:800;text-transform:capitalize}.tlm .d{font-size:11px;color:var(--muted)}
.tlm .tot{font-size:18px;font-weight:800;margin:8px 0 2px}
.tlm input{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:5px 7px;text-align:right;margin-top:3px}
.tlm .lb{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-top:6px}
.sec{border-radius:16px;overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow);background:#fff;border:1px solid #EEF1F6}
.sec>.hd{padding:14px 20px;color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;gap:10px}
.sec>.bd{padding:16px 20px}
.msg{padding:14px 16px;border-radius:12px;font-weight:600;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
.msg .e{font-size:18px;line-height:1.2}
.msg.rojo{background:#FEE2E2;color:#991B1B}.msg.verde{background:#DCFCE7;color:#166534}.msg.naranja{background:#FFEDD5;color:#9A3412}
.msg.amarillo{background:#FEF9C3;color:#854D0E}.msg.info{background:#EFF6FF;color:#1E3A8A}.msg.gris{background:#F3F4F6;color:#374151}
.avisos{display:flex;flex-direction:column;gap:10px}
.split{display:grid;grid-template-columns:240px 1fr 1.6fr;gap:10px 16px;align-items:center}
.split .lbl{font-weight:600}.split .amt{font-weight:800;font-size:18px;text-align:right}
.chat{display:flex;flex-direction:column;height:560px}
.chat .log{flex:1;overflow:auto;padding:6px 4px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:82%;padding:11px 14px;border-radius:14px;line-height:1.5;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.bub.ai{align-self:flex-start;background:#F1F5F9;border-bottom-left-radius:4px}
.bub.ai b{color:#0B1B3A}
.chat .in{display:flex;gap:8px;margin-top:10px}
.chat .in textarea{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;resize:none;height:48px}
.empty{color:var(--muted);text-align:center;padding:30px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0F172A;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:50;transition:opacity .3s}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;z-index:40}
.modal{background:#fff;border-radius:18px;padding:22px;width:min(760px,94vw);max-height:90vh;overflow:auto;box-shadow:0 30px 60px rgba(0,0,0,.3)}
.modal h2{margin:0 0 14px;font-size:18px}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.banner{padding:12px 16px;border-radius:12px;background:#FEF3C7;color:#92400E;font-weight:600;margin-bottom:16px;display:flex;gap:12px;align-items:center}
svg text{font-family:inherit}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid #F1F5F9}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--green)}
.check.done .tx{text-decoration:line-through;color:var(--muted)}
.loan{display:grid;grid-template-columns:1.4fr repeat(5,1fr);gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #F1F5F9}
.loan:last-child{border-bottom:0}
.small{font-size:12px}.tiny{font-size:11px}
.right{text-align:right}
/* ---- IA presente ---- */
.fab{position:fixed;right:22px;bottom:22px;z-index:30;border:0;cursor:pointer;display:flex;align-items:center;gap:8px;padding:14px 20px 14px 16px;border-radius:99px;background:linear-gradient(135deg,#2563EB,#7C3AED);color:#fff;font-size:22px;font-weight:700;box-shadow:0 12px 30px rgba(37,99,235,.45);transition:transform .15s}
.fab span{font-size:15px}.fab:hover{transform:translateY(-2px) scale(1.03)}
.fchat{position:fixed;right:22px;bottom:22px;z-index:30;width:440px;max-width:calc(100vw - 40px);height:min(680px,calc(100vh - 44px));background:#fff;border-radius:20px;box-shadow:0 24px 60px rgba(15,23,42,.35);display:flex;flex-direction:column;overflow:hidden;border:1px solid #E2E8F0}
.fhd{display:flex;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(135deg,#0B1B3A,#2563EB);color:#fff;font-weight:800;font-size:16px}
.fbody{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#F8FAFC}
.fbody .bub{max-width:92%}
.fchips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 0;background:#fff}
.chip{all:unset;cursor:pointer;font-size:12px;padding:5px 10px;border-radius:99px;background:#EFF6FF;color:#1E3A8A;font-weight:600}
.chip:hover{background:#DBEAFE}
.fadj{padding:6px 12px 0;background:#fff}
.fin{display:flex;gap:6px;align-items:flex-end;padding:10px 12px 12px;background:#fff}
.fin textarea{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;resize:none;height:46px;font-size:14px}
.fin textarea:focus{outline:none;border-color:var(--blue)}
.icon-btn.big{font-size:20px;padding:8px}
.icon-btn.rec{background:#FEE2E2;color:#DC2626;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.acts{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.act{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:12.5px;white-space:normal}
.act input{width:16px;height:16px;accent-color:var(--green)}
.act .atx{flex:1;line-height:1.35}
.act.done{background:#ECFDF5;border-color:#A7F3D0;color:#065F46}.act.desc{opacity:.45;text-decoration:line-through}
.dots::after{content:"…";animation:dots 1.2s steps(3,end) infinite;display:inline-block;width:1em;overflow:hidden;vertical-align:bottom}
@keyframes dots{0%{width:0}100%{width:1em}}
.dots{color:var(--muted);font-style:italic}
.hoy{background:linear-gradient(135deg,#EEF2FF,#F5F3FF 60%,#FDF4FF);border:1px solid #E0E7FF}
.hoy .hoytx{font-size:15px;line-height:1.7;white-space:pre-wrap}
.mesbtn{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;margin-bottom:4px;font-weight:600}
.mesbtn:hover{background:#F1F5F9}.mesbtn.on{background:#EFF6FF;box-shadow:inset 3px 0 0 var(--blue)}
.mini{background:#F8FAFC;border-radius:12px;padding:12px 14px}.mini b{font-size:20px}
.mdtx{line-height:1.65;white-space:pre-wrap}.mdh{font-weight:800;font-size:15px;color:#0B1B3A;margin:10px 0 2px}
.coment{animation:fadein .4s}@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
/* ---- login ---- */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0B1B3A,#1E3A8A 60%,#0EA5E9)}
.lcard{background:#fff;border-radius:22px;padding:30px 26px;width:min(400px,100%);text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.lcard h1{font-size:22px;margin:14px 0 4px}.lcard .sub{color:var(--muted);font-size:13px}
.lcard .fld{text-align:left;margin-top:12px}
/* ---- barra móvil ---- */
.mtop,.bnav{display:none}
@media (max-width: 860px){
  body{font-size:14px}
  .app{flex-direction:column;height:auto;min-height:100vh;overflow:visible}
  .side{position:fixed;inset:0 auto 0 0;z-index:45;width:260px;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.4)}
  body.navopen .side{transform:none}
  body.navopen::after{content:"";position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:44}
  .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#0B1B3A,#13285A);color:#fff;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
  .mtop button{all:unset;cursor:pointer;font-size:22px;padding:2px 6px}
  .mtop img{width:30px;height:30px;border-radius:8px}.mtop b{font-size:16px}.mtop .st{margin-left:auto;font-size:11px;color:#CBD5E1}
  .main{overflow:visible;padding:14px 12px 120px}
  .top{margin-bottom:12px}.top h1{font-size:20px}.top .sub{font-size:12px}.top .spacer{display:none}
  .monthsel{width:100%;justify-content:space-between}
  .g4{grid-template-columns:1fr 1fr}.g3,.g2,.g21,.g12{grid-template-columns:1fr}
  .grid[style*="grid-template-columns:260px"]{grid-template-columns:1fr!important}
  .card{padding:14px;overflow-x:auto}.kpi{padding:14px}.kpi .val{font-size:21px}.kpi .lab{font-size:10px}.sema{font-size:18px}
  .form{grid-template-columns:1fr 1fr!important}.form .fld[style*="span 2"]{grid-column:span 2}
  .addcard > div[style*="display:flex"]{flex-wrap:wrap}.addcard .btn.big{flex:1;justify-content:center}
  .split{grid-template-columns:1fr}.split .amt{text-align:left}
  table.t{font-size:12px}table.t th,table.t td{padding:7px 8px}
  .loan{grid-template-columns:1fr 1fr}
  .tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.tabs button{white-space:nowrap;padding:8px 12px}
  .fab{bottom:calc(76px + env(safe-area-inset-bottom));right:14px;padding:12px 16px 12px 13px;font-size:20px}.fab span{font-size:13px}
  .fchat{inset:0;width:100%;max-width:none;height:100%;border-radius:0}
  .fhd{padding-top:max(14px,env(safe-area-inset-top))}
  .fin{padding-bottom:max(12px,env(safe-area-inset-bottom))}
  .modal{width:100%;max-height:92vh;border-radius:18px 18px 0 0;align-self:end}.modal-bg{place-items:end center}.mgrid{grid-template-columns:1fr}

  // movimiento de "Cargar"
  function movRow(mv, data) {

  function recurring(row, m, data, montoField) {

  function compute(data, today) {

      const res = M.map(m => {

  // consumo del mes por categoría (como el Panel del Excel)
  function categorias(data, R, m) {

  // ----- asesor (misma lógica que la hoja Asesor)

    const p = P[k]; const A = data.asesor || {};

    const n6 = next(1, 6);
    const worst = n6.length ? n6.reduce((w, x) => x.J < w.J ? x : w, n6[0]) : null;
    const deficit6 = n6.reduce((s, x) => s + (x.J < 0 ? -x.J : 0), 0);

    const fondo = num(metasF.ahorrado); const faltaFondo = Math.max(0, metaFondo - fondo);

    // tarjetas

      const card = ci.card; const ofMonth = ci.res.filter(o => o.mesPago === m);
      const falta = Math.max(0, r2(ofMonth.reduce((s, o) => s + o.saldoUYU + o.saldoUSD * TC, 0)));
      const usd = Math.max(0, ofMonth.reduce((s, o) => s + o.saldoUSD, 0));
      const total = ofMonth.reduce((s, o) => s + o.totEq, 0);

      const minimo = falta <= 0 ? 0 : (has(mn.real) ? Math.min(falta, +mn.real) : Math.round(falta * pct));

    });

    });

    let planMsg;

    else if (extra < 0) planMsg = `⚠ No alcanza ni para los mínimos: faltan $ ${fmt(-extra)}. Usá ahorro para cubrirlos y frená todo gasto que no sea imprescindible.`;
    else if (totPagar >= totFalta - 0.5) planMsg = "✔ Este mes alcanza para pagar TODAS las tarjetas completas. No pagues solo el mínimo.";
    else planMsg = `Pagá completa primero la ${top.card.nombre} (la de más interés). En las demás pagá lo que dice la tabla. Te costará unos $ ${fmt(totInt)} de interés el mes que viene: cubrilo cuanto antes.`;

    push(masUsada && masUsada.pct > 0.7, "naranja", `La ${masUsada.card.nombre} está al ${Math.round(masUsada.pct * 100)}% del límite: no la uses hasta bajarla del 70%.`);

function hintTarjeta() {
  const f = FORM; if (f.tipo !== "Gasto" || !(+f.monto > 0) || (!f.categoria && !f.descripcion)) return "";
  try {
    const r = recomendarTarjeta(S.data, S.R, { monto: f.monto, moneda: f.moneda, categoria: f.categoria, descripcion: f.descripcion, fecha: f.fecha });
    const best = r.find(x => x.alcanza && x.desc > 0); const cur = r.find(x => x.c.nombre === f.medio);
    if (best && (!cur || cur.desc < best.desc)) return `💡 Con la <b>${esc(best.c.nombre)}</b> tenés ${esc(best.bTxt)} → ahorrás ~${money(best.desc)}${f.medio && f.medio !== best.c.nombre ? ` (con ${esc(f.medio)} no hay descuento)` : ""}.`;
    if (cur && cur.desc > 0) return `🎁 Bien: con la ${esc(cur.c.nombre)} tenés ${esc(cur.bTxt)} (~${money(cur.desc)}).`;
  } catch (e) { }
  return "";
}
function previewText() {
  const f = FORM; const mo = f.moneda === "USD" ? "U$S " : "$ ";
  if (!f.fecha || !f.descripcion || !f.monto) return "👀 Así queda: completá fecha, descripción y monto" + (f.tipo === "Gasto" ? " (y el medio de pago)." : ".");
  const r = E.movRow({ fecha: f.fecha, tipo: f.tipo, monto: +f.monto, medio: f.medio, cuotas: f.cuotas ? +f.cuotas : null, moneda: f.moneda }, S.data);
  if (f.tipo !== "Gasto") return `👀 Así queda: ingreso (${f.tipo}) de ${f.persona} por ${mo}${fmt(+f.monto, 2)} en ${E.mesLargo(r.mes)}${["Sueldo", "Aguinaldo", "SRV", "Licencia"].includes(f.tipo) ? " — reemplaza el estimado de ese mes" : ""}.`;
  if (!f.medio) return "👀 Así queda: elegí el medio de pago.";

function bindCargar(root) {

function addMov() {

function modal(title, fields, obj, onSave, extraBtn) {
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal"><h2>${title}</h2><div class="mgrid">${fields.map(([k, l, t, o]) => `<div class="fld" ${t === "area" ? 'style="grid-column:span 2"' : ""}><label>${l}</label>${t === "sel" ? `<select data-k="${k}">${opts(o, obj[k])}</select>` : t === "area" ? `<textarea data-k="${k}" rows="3">${esc(obj[k])}</textarea>` : `<input data-k="${k}" type="${t === "num" ? "number" : t}" step="any" value="${esc(obj[k] ?? "")}">`}</div>`).join("")}</div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px">${extraBtn ? `<button class="btn danger" id="mx">${extraBtn[0]}</button><div class="spacer"></div>` : ""}<button class="btn" id="mc">Cancelar</button><button class="btn blue" id="ms">Guardar</button></div></div>`;
  document.body.appendChild(bg);
  bg.querySelector("#mc").onclick = () => bg.remove();
  bg.onclick = (e) => { if (e.target === bg) bg.remove(); };
  if (extraBtn) bg.querySelector("#mx").onclick = () => { bg.remove(); extraBtn[1](); };
  bg.querySelector("#ms").onclick = () => {
    const v = {}; bg.querySelectorAll("[data-k]").forEach(el => { const f = fields.find(x => x[0] === el.dataset.k); let x = el.value; if (f[2] === "num") x = x === "" ? null : +x; if (x === "") x = null; v[el.dataset.k] = x; });
    bg.remove(); onSave(v);
  };
}

    const mo = a.moneda === "USD" ? (x) => usd(x, 0) : money;
    return `<div class="card"><h3>${/emergencia/i.test(a.nombre) ? "🛟" : /viaje/i.test(a.nombre) ? "✈️" : /auto/i.test(a.nombre) ? "🚗" : "🎯"} ${esc(a.nombre)}</h3>
      <div style="display:flex;gap:14px;align-items:center">${svgDonut(p, "#16A34A", Math.round(p * 100) + "%", "logrado")}

async function geminiModels() {
  const c = S.data.config;
  if (S._models) return S._models;
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=${encodeURIComponent(c.geminiKey)}`);
  const j = await r.json(); if (!r.ok) throw new Error(j.error ? j.error.message : "No se pudo conectar con Gemini");
  const ms = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent")).map(m => m.name.replace("models/", ""))
    .filter(n => /^gemini/.test(n) && !/tts|image|live|audio|embedding|robotics|computer/.test(n));
  const score = (n) => { const v = parseFloat((n.match(/gemini-(\d+(\.\d+)?)/) || [0, 0])[1]); return (n.includes("flash") ? 1000 : 0) + v * 10 - (n.includes("lite") ? 3 : 0) - (/preview|exp/.test(n) ? 50 : 0) - (/-\d{3,}$|latest/.test(n) ? 1 : 0); };
  ms.sort((a, b) => score(b) - score(a));
  if (!ms.length) throw new Error("Tu clave no tiene modelos disponibles");
  S._models = ms; return ms;
}
function fetchT(url, opt, ms) { const ac = new AbortController(); const t = setTimeout(() => ac.abort(), ms); return fetch(url, Object.assign({}, opt, { signal: ac.signal })).finally(() => clearTimeout(t)); }
// Prueba varios modelos a la vez con un mensaje mínimo y se queda con el mejor que responde
async function geminiPick() {
  const c = S.data.config; const ms = (await geminiModels()).slice(0, 10);
  const ok = [];
  await Promise.all(ms.map(async m => {
    try {
      const r = await fetchT(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(c.geminiKey)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: "ok" }] }], generationConfig: { maxOutputTokens: 256 } }) }, 15000);
      if (r.ok) ok.push(m);
    } catch (e) { }
  }));
  if (!ok.length) return null;
  ok.sort((a, b) => ms.indexOf(a) - ms.indexOf(b));
  const best = ok.find(m => !m.includes("lite")) || ok[0];
  S._model = best; c.geminiAuto = best; save(); return best;
}
async function geminiModel() { const c = S.data.config; return c.geminiModelo || S._model || c.geminiAuto || await geminiPick(); }
async function callModel(model, body) {
  const c = S.data.config;
  const r = await fetchT(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(c.geminiKey)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }, 60000);
  const j = await r.json();
  if (r.ok) { const t = (((j.candidates || [])[0] || {}).content || {}).parts; return { ok: true, text: t ? t.map(p => p.text || "").join("") : "(sin respuesta)" }; }
  return { ok: false, status: r.status, msg: j.error ? j.error.message : "" };
}
async function geminiAsk(contents, system, opts = {}) {
  const c = S.data.config; if (!c.geminiKey) throw new Error("Falta la clave de Gemini (Configuración)");
  const body = { contents, generationConfig: { temperature: opts.temp ?? 0.4, maxOutputTokens: 8192 } };
  if (opts.json) body.generationConfig.responseMimeType = "application/json";
  if (system) body.systemInstruction = { parts: [{ text: system }] };
  for (let intento = 0; intento < 2; intento++) {
    const model = intento === 0 ? await geminiModel() : await geminiPick();
    if (!model) break;
    let res;
    try { res = await callModel(model, body); } catch (e) { res = { ok: false, status: 0, msg: e.name === "AbortError" ? "tardó demasiado" : "sin conexión" }; }
    if (res.ok) { S._model = model; return res.text; }
    if (res.status === 400 || res.status === 403) throw new Error(res.msg || "La clave no es válida");
    if (c.geminiModelo) throw new Error(res.msg);
    S._model = null; c.geminiAuto = null;
  }
  throw new Error("Gemini está muy ocupado o llegaste al límite gratis por ahora. Probá de nuevo en unos minutos.");

async function fileToAdj(f) {
  const raw = await new Promise(res => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.readAsDataURL(f); });
  if (/^image\//.test(f.type) && f.size > 600e3) {
    try {
      const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = raw; });
      const k = Math.min(1, 1800 / Math.max(img.width, img.height)); const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      return { name: f.name || "foto.jpg", mime: "image/jpeg", data: cv.toDataURL("image/jpeg", 0.85).split(",")[1] };
    } catch (e) { }
  }
  return { name: f.name || "archivo", mime: f.type || "application/pdf", data: raw.split(",")[1] };
}

function gastoTarjetaDesde(d, cardIds, desdeISO, hastaISO) {
  const TC = +d.config.tc || 0; let s = 0;
  d.movimientos.forEach(m => { const c = d.tarjetas.find(t => t.nombre === m.medio); if (!c || !cardIds.includes(c.id) || (m.tipo && m.tipo !== "Gasto")) return; if (m.fecha > desdeISO && m.fecha <= hastaISO) s += (+m.monto || 0) * (m.moneda === "USD" ? TC : 1); });
  d.tarjetas.filter(t => cardIds.includes(t.id)).forEach(c => c.compras.forEach(x => { if (x.fecha && x.fecha > desdeISO && x.fecha <= hastaISO && !x.cuotaInicial) s += (+x.total || (+x.valorCuota || 0) * (+x.cuotas || 1)) * (x.moneda === "USD" ? TC : 1); }));
  // débitos automáticos / gastos fijos: se cuentan en cada cierre posterior a la fecha base
  d.fijos.forEach(f => { const c = d.tarjetas.find(t => t.nombre === f.medio); if (!c || !cardIds.includes(c.id)) return;
    let m = desdeISO.slice(0, 7); for (let i = 0; i < 24; i++) { const k = E.addM(m, i); const ci = `${k}-${String(Math.min(c.cierre, 28)).padStart(2, "0")}`; if (ci <= desdeISO) continue; if (ci > hastaISO) break; s += E.fijoMonto(f, k, d, S.R ? S.R.movs : []) * (f.moneda === "USD" ? TC : 1); } });
  return s;
}
function puntosInfo(d) {
  const hoy = todayISO();
  return (d.programas || []).map(p => {
    const gasto = gastoTarjetaDesde(d, p.tarjetas, p.fechaBase, hoy);
    const ganados = Math.floor(gasto / (+p.pesosPorPunto || 100));
    const canj = (d.canjes || []).filter(c => c.programa === p.id && c.fecha >= p.fechaBase).reduce((s, c) => s + (+c.puntos || 0), 0);
    const total = (+p.saldo || 0) + ganados - canj;
    return { p, gasto, ganados, canj, total, valor: p.valorPunto ? total * p.valorPunto : null };
  });
}

  $("#impF").onclick = () => {

    i.onchange = async () => {
      try {
        const d = JSON.parse(await i.files[0].text()); migrate(d);
        const movs = (d.movimientos || []).map(m => Object.assign({}, m, { id: m.id || uuid(), por: m.por || S.user.nombre }));
        const dp = docPart(d);
        let r = await sb.from("docs").insert({ hogar_id: S.hogar, data: dp, version: 1, updated_by: S.user.nombre }); if (r.error) throw r.error;
        const now = Date.now();
        const rows = movs.map((m, k) => ({ id: m.id, hogar_id: S.hogar, data: JSON.parse(movJ(m)), por: m.por, created_at: new Date(now - k * 1000).toISOString() }));
        if (rows.length) { r = await sb.from("movimientos").insert(rows); if (r.error) throw r.error; }
        $("#lmsg").textContent = "✔ Datos subidos"; const { data } = await sb.auth.getSession(); cloudStart(data.session.user);
      } catch (e) { $("#lmsg").style.color = "#B91C1C"; $("#lmsg").textContent = "No se pudo importar: " + e.message; }
    };
    i.click();
  };

function render() {
  const sc = $("#main") ? $("#main").scrollTop : 0; const wy = window.scrollY;
  S.R = Engine.compute(S.data);
  if (!S.mes || !S.R.months.includes(S.mes)) S.mes = S.R.months.includes(todayKey()) ? todayKey() : S.R.months[0];
  document.getElementById("root").innerHTML = shell();
  const main = $("#main");
  let banner = "";
  if (S.firstRun && !S.user) {
    main.innerHTML = `<div style="max-width:720px;margin:60px auto"><div class="card" style="padding:34px;text-align:center">
      <div style="font-size:54px">🏠</div><h1 style="margin:6px 0 4px">Finanzas del Hogar</h1><div class="mut">¿Cómo querés empezar en esta computadora?</div>
      <div class="grid g2" style="margin-top:26px;text-align:left">
        <div class="card" style="box-shadow:none;border:2px solid #2563EB"><h3>📂 Ya tengo mis datos</h3><div class="small mut" style="margin-bottom:14px">Abrí el archivo <b>finanzas-datos.json</b> de la carpeta FinanzasApp (por ejemplo, desde el disco externo).</div><button class="btn blue" id="frOpen">Abrir mi archivo de datos</button></div>
        <div class="card" style="box-shadow:none;border:1px solid var(--line)"><h3>✨ Empezar acá</h3><div class="small mut" style="margin-bottom:14px">Arranca con los datos que pasamos del Excel. Después elegí dónde guardar el archivo.</div><button class="btn" id="frNew">Empezar con los datos iniciales</button></div>
      </div></div></div>`;
    $("#frOpen").onclick = openFile;
    $("#frNew").onclick = () => { S.firstRun = false; save(); render(); };
    return;
  }
  if (S.fileState === "cloud") banner = "";
  else if (S.fileState === "lost") banner = `<div class="banner">📁 No encuentro tu archivo de datos (¿se movió o cambió el disco?). <button class="btn sm blue" id="opn">Abrir finanzas-datos.json</button> <button class="btn sm" id="cn3">Guardar en un archivo nuevo</button></div>`;
  else if (S.fileState === "prompt") banner = `<div class="banner">📁 Tus datos se guardan en un archivo de Documentos. <button class="btn sm blue" id="recon">Tocá acá para reconectarlo</button></div>`;
  else if (S.fileState === "offline") banner = `<div class="banner">⚠️ No se pudo guardar: la app tiene que abrirse con <b>"Abrir Finanzas del Hogar.bat"</b>. Cerrá esta ventana y abrila de nuevo con ese archivo.</div>`;
  else if (S.fileState === "none" && !S.data.noFileHint) banner = `<div class="banner">💾 Ahora tus datos se guardan en este navegador. Para tenerlos también en un archivo de Documentos: <button class="btn sm blue" id="cn2">Elegir archivo</button> <a href="#" id="hideHint" class="small">No mostrar más</a></div>`;
  main.innerHTML = banner + VIEWS[S.view][0]();
  if (VIEWS[S.view][1]) VIEWS[S.view][1](main);
  bindTables(main);
  main.scrollTop = sc; if (wy) window.scrollTo(0, wy);
  document.querySelectorAll("[data-bn]").forEach(b => b.onclick = () => { if (b.dataset.bn === "_menu") { document.body.classList.add("navopen"); return; } S.view = b.dataset.bn; render(); window.scrollTo(0, 0); $("#main").scrollTop = 0; });
  document.body.onclick = (e) => { if (document.body.classList.contains("navopen") && !e.target.closest(".side") && !e.target.closest(".mtop") && !e.target.closest(".bnav")) document.body.classList.remove("navopen"); };
  document.querySelectorAll("[data-nav]").forEach(b => b.onclick = () => { document.body.classList.remove("navopen"); window.scrollTo(0, 0); S.view = b.dataset.nav; $("#main").scrollTop = 0; render(); $("#main").scrollTop = 0; });
  main.querySelectorAll("[data-go]").forEach(a => a.onclick = (e) => { e.preventDefault(); S.view = a.dataset.go; render(); $("#main").scrollTop = 0; });
  main.querySelectorAll("[data-gomes]").forEach(a => a.onclick = (e) => { e.preventDefault(); S.mes = a.dataset.gomes; S.view = "panel"; render(); $("#main").scrollTop = 0; });
  const ms = $("#mesSel"); if (ms) ms.onchange = () => { S.mes = ms.value; render(); };
  main.querySelectorAll("[data-mes]").forEach(b => b.onclick = () => { const M = S.R.months.slice(0, 24); const i = M.indexOf(S.mes) + +b.dataset.mes; if (i >= 0 && i < M.length) { S.mes = M[i]; render(); } });
  const rc = $("#recon"); if (rc) rc.onclick = reconnect;
  const c2 = $("#cn2"); if (c2) c2.onclick = connectFile;
  const c3 = $("#cn3"); if (c3) c3.onclick = connectFile;
  const op = $("#opn"); if (op) op.onclick = openFile;
  const hh = $("#hideHint"); if (hh) hh.onclick = (e) => { e.preventDefault(); S.data.noFileHint = true; commit(); };
  renderChat();
  $("#fileState").onclick = () => { if (S.fileState === "prompt") reconnect(); else if (S.fileState === "lost") openFile(); else { S.view = "config"; render(); } };
}
document.addEventListener("keydown", (e) => {
  if (e.altKey && /^[1-9]$/.test(e.key)) { const n = NAV[+e.key - 1]; if (n) { S.view = n[0]; render(); } }
});
(async function init() {
  if (IS_CLOUD) { renderChat = renderChat; await cloudBoot(); return; }
  S.data = loadData();
  await initFile();
  render();
  autoInforme();
  autoBeneficios();
})();
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
