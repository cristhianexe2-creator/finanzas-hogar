// ===================== DÉBITOS AUTOMÁTICOS: qué día se cobra cada cosa (aprendido de lo cargado)
const PAL_GEN = /^(suscripcion|suscripción|plan|familiar|cargos?|seguro|cuota|mensual|tarjeta|envio|envío|estado|cuenta|gastos|promedio|presupuesto|del|de|la|el|los|las|con|por|para|pro|iva|adm|auto|casa|celular|telefono|teléfono|fijo|servicio|cristhian|melyna|mateo)$/i;
const sinTilde = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function clavesDe(nombre) { return sinTilde(nombre).replace(/\(.*?\)/g, " ").split(/[^a-z0-9ñ]+/).filter(w => w.length >= 4 && !PAL_GEN.test(w)); }
const isoDe = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

// todos los cargos con fecha: movimientos + compras de resúmenes
function cargosConFecha() {
  const out = [];
  S.data.movimientos.forEach(m => { if ((m.tipo || "Gasto") === "Gasto" && m.fecha) out.push({ fecha: m.fecha, desc: m.descripcion || "", medio: m.medio || "", moneda: m.moneda || "UYU", monto: +m.monto || 0 }); });
  S.data.tarjetas.forEach(t => (t.compras || []).forEach(c => { if (c.fecha && (+c.cuotas || 1) <= 1) out.push({ fecha: c.fecha, desc: c.comercio || "", medio: t.nombre, moneda: c.moneda || "UYU", monto: +c.total || +c.valorCuota || 0 }); }));
  return out;
}

// cuándo cae en el resumen de una tarjeta
function resumenDeCargo(medio, fechaISO) {
  const t = S.data.tarjetas.find(x => x.nombre === medio); if (!t || !t.cierre) return null;
  const [y, m, d] = fechaISO.split("-").map(Number);
  const cierreMes = d <= t.cierre ? new Date(y, m - 1, 1) : new Date(y, m, 1);
  const lastC = new Date(cierreMes.getFullYear(), cierreMes.getMonth() + 1, 0).getDate();
  const cierre = new Date(cierreMes.getFullYear(), cierreMes.getMonth(), Math.min(t.cierre, lastC));
  const vMes = new Date(cierre.getFullYear(), cierre.getMonth() + (t.vence <= t.cierre ? 1 : 0), 1);
  const lastV = new Date(vMes.getFullYear(), vMes.getMonth() + 1, 0).getDate();
  const vence = new Date(vMes.getFullYear(), vMes.getMonth(), Math.min(t.vence, lastV));
  return { cierre: isoDe(cierre), vence: isoDe(vence) };
}

function debitos() {
  const C = cargosConFecha(), hoy = new Date(), hoyISO = todayISO(), out = [], usados = new Set();
  const mes = todayKey();
  S.data.fijos.forEach(f => {
    if ((f.hasta && f.hasta < mes) || (f.desde && f.desde > E.addM(mes, 2))) return;
    if (/presupuesto|promedio|comida \/ surtido/i.test(f.nombre)) return;
    const ks = clavesDe(f.nombre);
    const hits = ks.length ? C.filter(c => { const s = sinTilde(c.desc); return ks.some(k => s.includes(k)) && (!f.medio || c.medio === f.medio); }) : [];
    hits.forEach(h => usados.add(h));
    let dia = +f.dia || null, fuente = dia ? "guardado" : "";
    if (!dia && hits.length) { const ds = hits.map(h => +h.fecha.slice(8, 10)).sort((a, b) => a - b); dia = ds[Math.floor(ds.length / 2)]; fuente = `aprendido de ${hits.length} cargo${hits.length > 1 ? "s" : ""}`; }
    const ult = hits.map(h => h.fecha).sort().pop() || null;
    let prox = null;
    if (dia) {
      let y = hoy.getFullYear(), m = hoy.getMonth(); const ld = new Date(y, m + 1, 0).getDate();
      let p = new Date(y, m, Math.min(dia, ld)); if (isoDe(p) < hoyISO) { m++; p = new Date(y, m, Math.min(dia, new Date(y, m + 1, 0).getDate())); }
      // si es de meses específicos (ej. matrícula), saltar a un mes que corresponda
      for (let i = 0; i < 13 && !(E.fijoMonto(f, isoDe(p).slice(0, 7), S.data, S.R.movs) > 0); i++) { m++; p = new Date(y, m, Math.min(dia, new Date(y, m + 1, 0).getDate())); }
      prox = isoDe(p);
    }
    const monto = E.fijoMonto(f, prox ? prox.slice(0, 7) : mes, S.data, S.R.movs) || +f.monto || 0;
    out.push({ nombre: f.nombre, monto, moneda: f.moneda || "UYU", medio: f.medio || "", dia, fuente, ult, prox, res: prox ? resumenDeCargo(f.medio, prox) : null, fijo: true });
  });
  // cosas que se repiten todos los meses y NO están como gasto fijo
  const G = {};
  cargosConFecha().forEach(c => { if (usados.has(c) || /env[ií]o|resumen|seguro|iva|comisi|cargo|inter[eé]s|saldo/i.test(c.desc)) return; const k = normCom(c.desc); if (!k) return; (G[k] = G[k] || []).push(c); });
  Object.values(G).forEach(L2 => {
    const meses = new Set(L2.map(c => c.fecha.slice(0, 7))); if (meses.size < 2) return;
    const vs = L2.map(c => c.monto).sort((a, b) => a - b), med = vs[Math.floor(vs.length / 2)];
    if (!(med > 0) || vs.some(v => Math.abs(v - med) > med * 0.3)) return;
    const ds = L2.map(c => +c.fecha.slice(8, 10)).sort((a, b) => a - b), dia = ds[Math.floor(ds.length / 2)], u = L2.map(c => c.fecha).sort().pop();
    out.push({ nombre: L2[0].desc, monto: med, moneda: L2[0].moneda, medio: L2[0].medio, dia, fuente: `se repite ${meses.size} meses`, ult: u, prox: null, res: null, fijo: false });
  });
  return out.sort((a, b) => (a.prox || "9999").localeCompare(b.prox || "9999"));
}

function descFijarDia(a) { const f = S.data.fijos.find(x => sinTilde(x.nombre) === sinTilde(a.nombre)) || S.data.fijos.find(x => clavesDe(a.nombre).some(k => sinTilde(x.nombre).includes(k))); return `📅 <b>${esc(f ? f.nombre : a.nombre)}</b> se debita el día <b>${+a.dia || "?"}</b>${f ? "" : ' <span class="pill red">no lo encuentro</span>'}`; }
function aplicarFijarDia(a) {

// ===================== CAZADOR DE COMISIONES Y CARGOS ESCONDIDOS
const RX_FEE = /comisi|seguro|env[ií]o (de )?(estado|resumen)|estado de cuenta|iva.*cargo|cuota (mensual|anual)|membres|gastos? adm|cargo|mantenimiento|renovaci|asistencia|beneficia|mapfre/i;

  });
  d.cazador.extras.forEach(x => out.push({ key: "x:" + x.id, nombre: x.nombre, medio: x.medio || "", moneda: x.moneda || "UYU", monto: +x.monto || 0, mes$: uyuEq(x.moneda, +x.monto || 0) }));
  // intereses que vienen en los próximos resúmenes
  try { const I = intereses(); if (I.proximo > 0) out.push({ key: "intereses", nombre: "Intereses de tarjetas (próximos resúmenes)", medio: [...new Set(I.proximos.map(x => x.tarjeta))].join(", "), moneda: "UYU", monto: I.proximo, mes$: 0, unico: true }); } catch (e) { }
  // cargos que aparecieron en resúmenes de los últimos 3 meses y no están anotados
  const desde = E.addM(mes, -3) + "-01", vistos = new Set();
  d.tarjetas.forEach(t => (t.compras || []).forEach(c => {
    if (!c.fecha || c.fecha < desde || !RX_FEE.test(c.comercio || "") || (typeof RX_INT !== "undefined" && RX_INT.test(c.comercio || "")) || /kedal|pr[eé]stamo/i.test(c.comercio || "")) return;
    const v = +c.total || +c.valorCuota || 0;
    const tipoDe = x => { const n = sinTilde(x); return [/seguro/.test(n) && "seguro", /\biva\b/.test(n) && "iva", /envio|estado de cuenta|resumen/.test(n) && "envio", /comision|gastos adm/.test(n) && "comision"].filter(Boolean); };
    const combinado = out.some(o => o.medio === t.nombre && o.fijo !== undefined && /\(.*\+.*\)/.test(o.nombre) && tipoDe(c.comercio).some(k => tipoDe((o.nombre.match(/\((.*)\)/) || [])[1] || "").includes(k)));
    const cubierto = combinado || out.some(o => o.medio === t.nombre && !o.unico && Math.abs(uyuEq(c.moneda, v) - o.mes$) <= Math.max(15, o.mes$ * 0.2)) || out.some(o => clavesDe(c.comercio).some(k => sinTilde(o.nombre).includes(k)));
    const k = t.nombre + "|" + sinTilde(c.comercio); if (cubierto || vistos.has(k)) return; vistos.add(k);
    const anual = /anual|renovaci/i.test(c.comercio);
    out.push({ key: "c:" + k, nombre: c.comercio, medio: t.nombre, moneda: c.moneda || "UYU", monto: v, mes$: uyuEq(c.moneda, v) / (anual ? 12 : 1), anual, nuevo: c.fecha });
  }));
  out.forEach(o => { o.est = (d.cazador.estados[o.key] || {}).estado || "Pendiente"; o.c = consejoCargo(o.nombre); });
  return out.sort((a, b) => (b.mes$ || b.monto) - (a.mes$ || a.monto));
}

    if (t.exterior && !r) p.push("compras en el exterior y webs del exterior SIN recargo (no cobra el 3% + IVA)");

function provisiones9() {
  migrar9();
  const d = S.data, hoy = todayKey(), out = [];
  d.fijos.forEach(f => {
    if ((f.hasta && f.hasta < hoy) || L.isCard(f.medio) && /Cargos bancarios/.test(f.categoria || "")) return;
    const meses = []; for (let i = 1; i <= 12; i++) { const m = E.addM(hoy, i), v = E.fijoMonto(f, m, d, S.R.movs); if (v > 0) meses.push({ m, v: uyuEq(f.moneda, v) }); }
    if (!meses.length || meses.length > 6) return;
    const anual = meses.reduce((s, x) => s + x.v, 0), prox = meses[0];
    out.push({ key: "f:" + f.nombre, nombre: f.nombre, anual, prox, veces: meses.length });
  });
  d.provisiones.extras.forEach((x, i) => {
    const mm = String(x.mes).padStart(2, "0"); let m = hoy.slice(0, 4) + "-" + mm; if (m <= hoy) m = E.addM(m, 12);
    out.push({ key: "x:" + i, nombre: x.nombre, anual: +x.monto || 0, prox: { m, v: +x.monto || 0 }, veces: 1, extra: i });
  });
  out.forEach(o => {
    o.juntado = +d.provisiones.juntado[o.key] || 0;
    o.mesesHasta = Math.max(1, E.diffM(o.prox.m, hoy));
    o.porMes = Math.max(0, (o.prox.v - o.juntado) / o.mesesHasta);
    o.normal = o.anual / 12;
  });
  return out.sort((a, b) => a.prox.m.localeCompare(b.prox.m));
}

// ===================== IRPF / NOMINAL → LÍQUIDO (Uruguay) =====================
const IRPF_UY = {
  anio: 2026, bpc: 6864,
  franjas: [[0, 7, 0], [7, 10, 0.10], [10, 15, 0.15], [15, 30, 0.24], [30, 50, 0.25], [50, 75, 0.27], [75, 115, 0.31], [115, Infinity, 0.36]],
  hijoMes: 11440, // 20 BPC anuales por hijo menor (100% atribuido)
  jubil: 0.15, frl: 0.001
};
function irpfCfg() {
  const c = (S.data.config.irpf = Object.assign({ fonasa: 6, hijos: 1, pctHijo: 50, fondoSol: 0, otras: 0 }, S.data.config.irpf || {}));
  return c;
}
function irpfCalc(nominal, o) {
  o = Object.assign({}, irpfCfg(), o || {});
  const B = IRPF_UY.bpc, N = +nominal || 0;
  const aport = N * IRPF_UY.jubil, fon = N * (+o.fonasa || 0) / 100, frl = N * IRPF_UY.frl;
  const base = N > 10 * B ? N * 1.06 : N; // rentas > 10 BPC se incrementan 6%
  let bruto = 0; const det = [];
  IRPF_UY.franjas.forEach(([d, h, t]) => {
    const lo = d * B, hi = h * B; if (base <= lo) return;
    const tramo = Math.min(base, hi) - lo, v = tramo * t;
    bruto += v; det.push({ desde: lo, hasta: hi, tasa: t, tramo, v });
  });
  const tasaDed = N <= 15 * B ? 0.14 : 0.08;
  const sumaDed = aport + fon + frl + IRPF_UY.hijoMes * (+o.hijos || 0) * (+o.pctHijo || 0) / 100 + (+o.fondoSol || 0) + (+o.otras || 0);
  const ded = sumaDed * tasaDed;
  const irpf = Math.max(0, bruto - ded);
  const marginal = (det.length ? det[det.length - 1].tasa : 0);
  return { nominal: N, base, aport, fon, frl, bruto, tasaDed, sumaDed, ded, irpf, liquido: N - aport - fon - frl - irpf, marginal, det, o };
}
function irpfTexto(c) {
  const r = irpfCalc(+c.nominal, c);
  let t = `Nominal $ ${fmt(r.nominal)}${r.base !== r.nominal ? ` (para IRPF se incrementa 6% → $ ${fmt(r.base)})` : ""}.
Aportes: jubilatorio 15% $ ${fmt(r.aport)}, FONASA ${r.o.fonasa}% $ ${fmt(r.fon)}, FRL 0,1% $ ${fmt(r.frl)}.
IRPF por franjas: ${r.det.filter(x => x.tasa > 0).map(x => `${Math.round(x.tasa * 100)}% sobre $ ${fmt(x.tramo)} = $ ${fmt(x.v)}`).join("; ") || "no llega al mínimo no imponible"} → bruto $ ${fmt(r.bruto)}.
Deducciones: $ ${fmt(r.sumaDed)} × ${Math.round(r.tasaDed * 100)}% = $ ${fmt(r.ded)} (hijos: ${r.o.hijos} al ${r.o.pctHijo}%).
IRPF del mes ≈ $ ${fmt(r.irpf)}. Franja marginal: ${Math.round(r.marginal * 100)}%.
LÍQUIDO ESTIMADO (antes de otros descuentos como préstamos, cuota sindical, etc.) ≈ $ ${fmt(r.liquido)}.`;
  if (+c.extra) {
    const r2 = irpfCalc(+c.nominal + +c.extra, c);
    t += `\nSi ese mes se suma una partida de $ ${fmt(+c.extra)} nominal (ej. SRV): IRPF ≈ $ ${fmt(r2.irpf)} (+$ ${fmt(r2.irpf - r.irpf)}), líquido total ≈ $ ${fmt(r2.liquido)}; de la partida te quedan ≈ $ ${fmt(r2.liquido - r.liquido)}.`;
  }
  return t;
}
function contextoIRPF() {

Franjas mensuales: ${IRPF_UY.franjas.map(([d, h, t]) => `${h === Infinity ? "más de $ " + fmt(d * B) : "$ " + fmt(d * B) + "–" + fmt(h * B)}: ${Math.round(t * 100)}%`).join(" · ")}. Es progresivo: cada tasa se aplica solo a la parte del sueldo que cae en esa franja.

const RX_DELIVERY = /delivery|pedidos ?ya|rappi|uber ?eats|mc ?donald|burger king|mostaza|subway|domino|pizza/i;

// ---------- 1) Hoy podés gastar
function hoyGastar() {
  const r = ritmoMes(), d = r.dia, ant = d > 1 ? r.A[d - 2] : 0, hoy = r.A[d - 1] - ant;
  const quedan = r.nd - d + 1, porDia = Math.max(0, (r.pres - ant) / quedan);
  const disp = porDia - hoy, desdeMan = quedan > 1 ? Math.max(0, (r.pres - r.A[d - 1]) / (quedan - 1)) : 0;
  const k = S.R.months.indexOf(r.m), p = S.R.proy[k] || {};
  return { porDia, hoy, disp, desdeMan, quedan, pres: r.pres, fuente: r.fuente, llevo: r.A[d - 1], rojo: (p.J || 0) < 0 };
}
function hoyGastarHTML() {
  if (S.mes !== todayKey()) return "";
  const h = hoyGastar(), ok = h.disp >= 0;
  const nuevo = (S._logroNuevo || []).map(l => `<div class="msg verde" style="margin-top:8px"><span class="e">🏅</span><span>¡Nuevo logro: <b>${esc(l)}</b>! <a href="#" data-go="progreso">Ver mis logros →</a></span></div>`).join("");
  return `<div class="card" style="margin-top:16px;border:2px solid ${ok ? "#86EFAC" : "#FCA5A5"};background:${ok ? "linear-gradient(135deg,#F0FDF4,#fff)" : "linear-gradient(135deg,#FEF2F2,#fff)"}">

// ---------- 2) Patrimonio (sin casa ni auto: solo lo que se puede contar)
function cfgProg() { return (S.data.config.progreso = Object.assign({ saldo: null, saldoFecha: null }, S.data.config.progreso || {})); }
function patrimonio() {
  const c = cfgProg(), ahorros = S.data.ahorro.reduce((s, a) => s + uyuEq(a.moneda || "UYU", +a.ahorrado || 0), 0);
  const cuentas = +c.saldo || 0, alcSuelto = +((S.data.alcancia || {}).suelto) || 0;
  const prest = deudas().filter(x => x.tipo === "extra" || !/tarjeta/i.test(x.forma)).reduce((s, x) => s + x.saldo, 0);
  const tarj = S.R.cards.reduce((s, ci) => s + Math.max(0, ci.usado || 0), 0);
  const activos = ahorros + alcSuelto + cuentas, deuda = prest + tarj;
  return { ahorros: ahorros + alcSuelto, cuentas, prest, tarj, activos, deuda, neto: activos - deuda };
}
function snapshotProgreso() {
  const P = patrimonio(), m = todayKey(), H = (S.data.progresoHist = S.data.progresoHist || {});
  const e = edadDinero(), v = { a: Math.round(P.activos), d: Math.round(P.deuda), n: Math.round(P.neto), e: e.dias === null ? null : Math.round(e.dias) };
  if (JSON.stringify(H[m]) !== JSON.stringify(v)) { H[m] = v; return true; }
  return false;
}
function libreDePrestamos() {
  const D = deudas().filter(x => x.tipo === "prestamo");
  if (!D.length) return null;
  const s = simDeudas(D, "actual", 0, 0); return { hasta: s.hasta, serie: s.serie, total: D.reduce((a, x) => a + x.saldo, 0) };
}

// ---------- 4) Edad del dinero (YNAB): cuántos días aguanta la plata que tenés al ritmo de gasto
function edadDinero() {
  const c = cfgProg(), k = S.R.months.indexOf(todayKey());
  const I = [0, 1, 2].map(i => (S.R.proy[k + i] || {}).I).filter(v => v > 0);
  const egr = I.length ? I.reduce((s, v) => s + v, 0) / I.length : (S.R.proy[k] || {}).I || 0;
  const porDia = egr / 30;
  if (c.saldo === null || c.saldo === "" || !(porDia > 0)) return { dias: null, porDia };
  const dias = Math.max(0, (+c.saldo) / porDia);
  const nivel = dias < 7 ? ["🔴", "Vivís al día: la plata entra y sale enseguida."] : dias < 15 ? ["🟠", "Arrancando: ya tenés unos días de aire."] : dias < 30 ? ["🟡", "Bien: falta poco para el mes de ventaja."] : ["🟢", "¡Meta lograda! Este mes gastás la plata del mes pasado."];
  return { dias, porDia, nivel, viejo: c.saldoFecha && (Date.now() - new Date(c.saldoFecha).getTime()) > 10 * 864e5 };
}

// ---------- 3) Reglas de ahorro (se pausan solas mientras hay meses en rojo)
function reglas() { return (S.data.reglasAhorro = S.data.reglasAhorro || []); }
function reglasActivas() {
  const k = S.R.months.indexOf(todayKey()), J = S.R.proy.slice(k, k + 4).map(p => p.J);
  const rojo = J.some(v => v < 0);
  return { on: !rojo, motivo: rojo ? `hay meses en rojo (${S.R.proy.slice(k, k + 4).filter(p => p.J < 0).map(p => E.mesCorto(p.mes)).join(", ")}): hoy cada peso va a cubrir eso y a las deudas` : "" };
}
function juntadoRegla(rg, m) {
  const C = todasCompras(false).filter(c => c.fecha.slice(0, 7) === m);
  if (rg.tipo === "redondeo") { const b = +rg.monto || 100; return C.reduce((s, c) => s + ((b - (c.v % b)) % b), 0); }
  if (rg.tipo === "por_gasto") { const rx = new RegExp((rg.patron || "delivery").replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i"); return C.filter(c => rx.test(c.desc) || rx.test(c.cat) || (/delivery/i.test(rg.patron || "") && RX_DELIVERY.test(c.desc))).length * (+rg.monto || 0); }
  if (rg.tipo === "pct_extra") return S.data.movimientos.filter(mv => mv.fecha && mv.fecha.slice(0, 7) === m && /Aguinaldo|SRV|Licencia/.test(mv.tipo || "")).reduce((s, mv) => s + uyuEq(mv.moneda, +mv.monto || 0), 0) * (+rg.monto || 0) / 100;
  if (rg.tipo === "fijo_mes") return +rg.monto || 0;
  return 0;
}
function descRegla(rg) {
  return rg.tipo === "redondeo" ? `Redondear cada compra a $ ${fmt(+rg.monto || 100)} y guardar la diferencia` : rg.tipo === "por_gasto" ? `Cada compra de "${esc(rg.patron || "delivery")}" → guardar $ ${fmt(+rg.monto || 0)}` : rg.tipo === "pct_extra" ? `${+rg.monto || 0}% de cada aguinaldo/SRV/licencia` : `$ ${fmt(+rg.monto || 0)} fijos por mes`;
}

// ---------- 5) Desafíos automáticos
function fechaLocal(x) { return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); }
// Racha de días sin NINGÚN gasto cargado (cualquier categoría y medio), contando desde ayer hacia atrás
function diasSinGastoRacha() {
  const dias = new Set(todasCompras(false).filter(c => c.v > 0).map(c => String(c.fecha).slice(0, 10)));
  S.data.movimientos.forEach(mv => { if ((mv.tipo || "Gasto") === "Gasto" && mv.fecha && +mv.monto > 0) dias.add(String(mv.fecha).slice(0, 10)); });
  if (![...dias].some(f => f >= fechaLocal(new Date(Date.now() - 10 * 864e5)))) return 0; // si no se está cargando nada, no cuenta
  let n = 0; const f = new Date(); f.setDate(f.getDate() - 1);
  for (let i = 0; i < 90; i++) { if (dias.has(fechaLocal(f))) break; n++; f.setDate(f.getDate() - 1); }
  return n;
}

function render() {
  const sc = $("#main") ? $("#main").scrollTop : 0; const wy = window.scrollY;
  S.R = Engine.compute(S.data);
  if (!S.mes || !S.R.months.includes(S.mes)) S.mes = S.R.months.includes(todayKey()) ? todayKey() : S.R.months[0];
  document.getElementById("root").innerHTML = shell();
  const main = $("#main");
  let banner = "";
  if (S.firstRun && !S.user) {
    main.innerHTML = `<div style="max-width:720px;margin:60px auto"><div class="card" style="padding:34px;text-align:center">
      <div style="font-size:54px">🏠</div><h1 style="margin:6px 0 4px">Finanzas del Hogar</h1><div class="mut">¿Cómo querés empezar en esta computadora?</div>
      <div class="grid g2" style="margin-top:26px;text-align:left">
        <div class="card" style="box-shadow:none;border:2px solid #2563EB"><h3>📂 Ya tengo mis datos</h3><div class="small mut" style="margin-bottom:14px">Abrí el archivo <b>finanzas-datos.json</b> de la carpeta FinanzasApp (por ejemplo, desde el disco externo).</div><button class="btn blue" id="frOpen">Abrir mi archivo de datos</button></div>
        <div class="card" style="box-shadow:none;border:1px solid var(--line)"><h3>✨ Empezar acá</h3><div class="small mut" style="margin-bottom:14px">Arranca con los datos que pasamos del Excel. Después elegí dónde guardar el archivo.</div><button class="btn" id="frNew">Empezar con los datos iniciales</button></div>
      </div></div></div>`;
    $("#frOpen").onclick = openFile;
    $("#frNew").onclick = () => { S.firstRun = false; save(); render(); };
    return;
  }
  if (S.fileState === "cloud") banner = "";
  else if (S.fileState === "lost") banner = `<div class="banner">📁 No encuentro tu archivo de datos (¿se movió o cambió el disco?). <button class="btn sm blue" id="opn">Abrir finanzas-datos.json</button> <button class="btn sm" id="cn3">Guardar en un archivo nuevo</button></div>`;
  else if (S.fileState === "prompt") banner = `<div class="banner">📁 Tus datos se guardan en un archivo de Documentos. <button class="btn sm blue" id="recon">Tocá acá para reconectarlo</button></div>`;
  else if (S.fileState === "offline") banner = `<div class="banner">⚠️ No se pudo guardar: la app tiene que abrirse con <b>"Abrir Finanzas del Hogar.bat"</b>. Cerrá esta ventana y abrila de nuevo con ese archivo.</div>`;
  else if (S.fileState === "none" && !S.data.noFileHint) banner = `<div class="banner">💾 Ahora tus datos se guardan en este navegador. Para tenerlos también en un archivo de Documentos: <button class="btn sm blue" id="cn2">Elegir archivo</button> <a href="#" id="hideHint" class="small">No mostrar más</a></div>`;
  main.innerHTML = banner + VIEWS[S.view][0]();
  if (VIEWS[S.view][1]) VIEWS[S.view][1](main);
  bindTables(main);
  if (typeof chequearAlcancia === "function") setTimeout(chequearAlcancia, 400);
  main.scrollTop = sc; if (wy) window.scrollTo(0, wy);
  document.querySelectorAll("[data-bn]").forEach(b => b.onclick = () => { if (b.dataset.bn === "_menu") { document.body.classList.add("navopen"); return; } S.view = b.dataset.bn; render(); window.scrollTo(0, 0); $("#main").scrollTop = 0; });
  document.body.onclick = (e) => { if (document.body.classList.contains("navopen") && !e.target.closest(".side") && !e.target.closest(".mtop") && !e.target.closest(".bnav")) document.body.classList.remove("navopen"); };
  document.querySelectorAll("[data-nav]").forEach(b => b.onclick = () => { document.body.classList.remove("navopen"); window.scrollTo(0, 0); S.view = b.dataset.nav; $("#main").scrollTop = 0; render(); $("#main").scrollTop = 0; });
  main.querySelectorAll("[data-go]").forEach(a => a.onclick = (e) => { e.preventDefault(); S.view = a.dataset.go; render(); $("#main").scrollTop = 0; });
  main.querySelectorAll("[data-gomes]").forEach(a => a.onclick = (e) => { e.preventDefault(); S.mes = a.dataset.gomes; S.view = "panel"; render(); $("#main").scrollTop = 0; });
  const ms = $("#mesSel"); if (ms) ms.onchange = () => { S.mes = ms.value; render(); };
  main.querySelectorAll("[data-mes]").forEach(b => b.onclick = () => { const M = S.R.months.slice(0, 24); const i = M.indexOf(S.mes) + +b.dataset.mes; if (i >= 0 && i < M.length) { S.mes = M[i]; render(); } });
  const rc = $("#recon"); if (rc) rc.onclick = reconnect;
  const c2 = $("#cn2"); if (c2) c2.onclick = connectFile;
  const c3 = $("#cn3"); if (c3) c3.onclick = connectFile;
  const op = $("#opn"); if (op) op.onclick = openFile;
  const hh = $("#hideHint"); if (hh) hh.onclick = (e) => { e.preventDefault(); S.data.noFileHint = true; commit(); };
  renderChat();
  $("#fileState").onclick = () => { if (S.fileState === "prompt") reconnect(); else if (S.fileState === "lost") openFile(); else { S.view = "config"; render(); } };
}
document.addEventListener("keydown", (e) => {
  if (e.altKey && /^[1-9]$/.test(e.key)) { const n = NAV[+e.key - 1]; if (n) { S.view = n[0]; render(); } }
});
(async function init() {
  if (IS_CLOUD) { renderChat = renderChat; await cloudBoot(); return; }
  S.data = loadData();
  await initFile();
  render();
  autoInforme();
  autoBeneficios();
  setTimeout(() => autoCotizaciones(false), 2500);
})();
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
